name: WRF slika (ghcr.io)

# Zgradi vsebnik z WRF 4.6.1 + WPS 4.6.0 (wrf/Dockerfile) in ga objavi v GitHub Container Registry. Prevajanje WRF traja
# ~1 uro, zato teče samo ob spremembi Dockerfile ali ročno. Sliko nato povleče strežnik, na katerem teče dnevni tek
# (glej docs/wrf-model.md); v repozitoriju ni nobenega samodejnega dnevnega teka, dokler ni prvega uspešnega ročnega.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wrf/Dockerfile'
      - '.github/workflows/wrf-image.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ime slike (male črke)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-wrf" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: wrf
          file: wrf/Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:4.6.1
            ${{ steps.img.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
