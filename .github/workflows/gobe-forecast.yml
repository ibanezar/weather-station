name: Gobarska napoved

on:
  schedule:
    - cron: '0 5 * * *'   # 5:00 UTC daily (6:00 CET / 7:00 CEST), po generate-seo-pages.yml
  workflow_dispatch:        # allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Izračunaj gobarski model (free + premium)
        run: |
          python3 tools/gobe_model.py \
            --out-premium /tmp/premium.json \
            --out-premium-today /tmp/premium-today.json

      # Payload gre stisnjen (~0,5 MiB namesto ~12 MiB) in tak ostane v KV —
      # glej /premium/data v worker.js, zakaj: nestisnjen je dvakrat prerasel
      # mejo in je KV tedne tiho stregla staro napoved.
      - name: Push premium JSON v Worker KV
        env:
          PREMIUM_SYNC_KEY: ${{ secrets.PREMIUM_SYNC_KEY }}
        run: |
          if [ -z "$PREMIUM_SYNC_KEY" ]; then
            echo "PREMIUM_SYNC_KEY ni nastavljen — preskočim KV push."
            exit 0
          fi
          gzip -9 -c /tmp/premium.json > /tmp/premium.json.gz
          ls -lh /tmp/premium.json /tmp/premium.json.gz /tmp/premium-today.json

          push() {  # $1 = URL, $2 = datoteka, ostalo = dodatne glave curl
            local urlp="$1" file="$2"; shift 2
            for i in 1 2 3; do
              code=$(curl -s -o /tmp/push-out.json -w '%{http_code}' -X POST "$urlp" \
                -H "Authorization: Bearer $PREMIUM_SYNC_KEY" "$@" \
                --data-binary @"$file")
              if [ "$code" = "200" ]; then cat /tmp/push-out.json; echo; return 0; fi
              echo "Poskus $i ni uspel (HTTP ${code:-—}): $(cat /tmp/push-out.json 2>/dev/null)"
              sleep $((i * 5))
            done
            return 1
          }

          BASE="https://weatherireica1.filip-eremita.workers.dev/premium/data"
          # Napaka tu se NE sme požreti: prav tiha odpoved (curl -sf brez
          # preverjanja kode) je dvakrat pustila mesec dni staro napoved v KV.
          push "$BASE" /tmp/premium.json.gz \
            -H "Content-Type: application/gzip" -H "X-Premium-Gzip: 1" || {
            echo "::error::Premium JSON ni bil naložen v KV — napoved v KV ostaja stara."; exit 1; }
          push "$BASE?kind=today" /tmp/premium-today.json \
            -H "Content-Type: application/json" || {
            echo "::error::Dnevni izvleček (kind=today) ni bil naložen — alarmi bi tekli po starih podatkih."; exit 1; }

      - name: Alarm premium naročnikom (pogoji optimalni)
        env:
          PREMIUM_SYNC_KEY: ${{ secrets.PREMIUM_SYNC_KEY }}
        run: |
          if [ -z "$PREMIUM_SYNC_KEY" ]; then
            echo "PREMIUM_SYNC_KEY ni nastavljen — preskočim alarm."
            exit 0
          fi
          # Worker sam odloči (prag + cooldown), ali dejansko pošlje.
          curl -sf -X POST "https://weatherireica1.filip-eremita.workers.dev/premium/notify" \
            -H "Authorization: Bearer $PREMIUM_SYNC_KEY" || \
            echo "::warning::Klic /premium/notify ni uspel."

      # if: always() — statične strani so neodvisne od KV in se morajo
      # osvežiti tudi, kadar push v KV pade (korak zgoraj namenoma pade
      # glasno, da odpoved ne ostane neopažena kot doslej).
      - name: Generate gobarska-napoved stran
        if: always()
        run: python3 tools/generate_gobe_page.py

      - name: Commit & push if changed
        if: always()
        run: |
          git config user.name  "meteorec-bot"
          git config user.email "bot@meteorec.si"
          git add gobarska-napoved/ || true
          git diff --cached --quiet && echo "Ni sprememb." && exit 0
          git commit -m "seo: posodobi gobarsko napoved $(date -u +%Y-%m-%d) [skip ci]"
          # Generiranje zgoraj traja ~4 min, v tem času pa na main pogosto
          # pišejo tudi drugi delovni tokovi (npr. prerender-current.yml na
          # 15-20 min) — navaden "git push" je zato tu občasno padel z
          # "rejected (fetch first)", čeprav ni bilo pravega konflikta
          # vsebine (drug tok ne dotika gobarska-napoved/). Rebase + ponovni
          # poskus namesto ročnega re-runa.
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "Push zavrnjen (verjetno je drug delovni tok medtem pisal na main) — poskus $i, rebase in ponovim …"
            git fetch origin main
            git rebase origin/main || { git rebase --abort; echo "::error::Rebase spodletel — potreben ročni pregled."; exit 1; }
            sleep $((i * 3))
          done
          echo "::error::Push ni uspel po $i poskusih."
          exit 1
