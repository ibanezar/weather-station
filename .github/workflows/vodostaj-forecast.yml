name: Vodostaj Savinje

on:
  schedule:
    - cron: '15 5 * * *'   # 5:15 UTC daily, po gobe-forecast.yml
  workflow_dispatch:        # allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Generate vodostaj-savinje stran
        run: python3 tools/generate_vodostaj_page.py

      - name: Commit & push if changed
        run: |
          git config user.name  "meteorec-bot"
          git config user.email "bot@meteorec.si"
          git add vodostaj-savinje/ || true
          git diff --cached --quiet && echo "Ni sprememb." && exit 0
          git commit -m "seo: posodobi vodostaj Savinje $(date -u +%Y-%m-%d) [skip ci]"
          # Drugi workflowi pišejo v main istočasno (varovalka v workerju sproži
          # več hkrati) -- zavrnjen push ni napaka, samo rebase in ponovni poskus.
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "Push zavrnjen (poskus $i/5) — rebase na najnovejši main in ponovni poskus …"
            git fetch origin main
            git rebase origin/main
            sleep $((i * 3))
          done
          echo "Push ni uspel po 5 poskusih." >&2
          exit 1
