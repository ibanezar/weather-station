name: 365-0 check

# The 365-0 game lives in the 365-0-game/ subfolder of this repository and is independent of the
# meteorec.si site. This workflow only runs when that folder changes.
on:
  push:
    paths:
      - '365-0-game/**'
      - '.github/workflows/365-0.yml'
  pull_request:
    paths:
      - '365-0-game/**'
      - '.github/workflows/365-0.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: 365-0-game

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 365-0-game/package-lock.json
      - run: npm ci
      - name: Typecheck, lint, unit tests, data validation
        run: npm run check
      - name: Build
        run: npm run build
      - name: Size budget
        run: npm run budget
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: End-to-end smoke test
        run: npm run e2e
