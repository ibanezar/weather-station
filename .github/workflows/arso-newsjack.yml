name: ARSO opozorila → /nevihte/

# Prej je ta workflow za vsako opozorilo ARSO objavil svojo blog objavo in jo
# poslal na FB/IG. GA4 (21. 7. – 17. 8. 2026) pokaže, da jih nihče ni bral:
# 5 objav, 10 ogledov, 0 sekund povprečnega časa branja; v Search Consoleu
# skupaj en klik. Objave niso prinesle obiska, so pa redčile blog (12 od 99
# objav) in sitemap.
#
# Opozorilo je stanje, ne novica — velja nekaj ur in se prekliče. Zato ga zdaj
# pišemo na obstoječo stran /nevihte/, ki je za to tema. Objav, IndexNow pinga
# in FB/IG koraka ni več: nič novega se ne objavi, le stran se osveži.
#
# 12 prejšnjih objav je pretvorjenih v preusmeritve na /nevihte/ (noindex +
# canonical), da se indeksirani URL-ji ne sesujejo v 404.

on:
  schedule:
    - cron: '*/15 * * * *'   # opozorila se hitro spreminjajo
  workflow_dispatch: {}

concurrency:
  group: arso-newsjack
  cancel-in-progress: false

jobs:
  warnings:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Zapiši aktivna opozorila ARSO na /nevihte/
        run: python3 tools/inject_arso_warnings.py

      - name: Commit & push (samo če se je stanje spremenilo)
        run: |
          git config user.name  "meteorec-bot"
          git config user.email "bot@meteorec.si"
          git add nevihte/index.html
          if git diff --cached --quiet; then
            echo "Opozorila brez sprememb."
            exit 0
          fi
          git commit -m "nevihte: osveži opozorila ARSO $(date -u +%Y-%m-%dT%H:%M) [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "Push zavrnjen (poskus $i/5) — rebase na najnovejši main in ponovni poskus …"
            git fetch origin main
            git rebase origin/main
            sleep $((i * 3))
          done
          echo "Push ni uspel po 5 poskusih." >&2
          exit 1
