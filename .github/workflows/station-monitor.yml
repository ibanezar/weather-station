name: Monitor IREICA1

on:
  schedule:
    - cron: '0 * * * *'   # vsako uro
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      # Preveri OBA vira: Weather Underground (PWS) in Ecowitt (prek workerja).
      # Razlika pove, kje je težava: če ne oddaja nobeden, je kriva postaja,
      # konzola ali domače omrežje; če manjka samo WU, je težava pri prenosu
      # na WU ali pri WU samem. 23. 10. 2026: dve noči zapored luknja ~21:00-03:40,
      # Ecowitt je imel luknje tudi, zato je monitor, ki je gledal samo WU,
      # vzrok napačno puščal odprt.
      - name: Preveri svežost podatkov postaje
        id: check
        run: |
          python3 - <<'PYEOF'
          import urllib.request, json, os
          from datetime import datetime, timezone

          WU_KEY = "619a8bb3ba4d42069a8bb3ba4d02061f"
          WU_URL = (
              "https://api.weather.com/v2/pws/observations/current"
              "?stationId=IREICA1&format=json&units=m&apiKey=" + WU_KEY
          )
          # Worker pri viru izbriše notranje meritve (CLAUDE.md, zasebnost); tu beremo
          # samo čas zunanje temperature, vrednosti se ne izpisujejo.
          EW_URL = "https://weatherireica1.filip-eremita.workers.dev/ecowitt-current"
          UA = "Mozilla/5.0 (compatible; meteorec-bot/1.0; +https://meteorec.si/o-postaji.html)"
          OFFLINE_MIN = 120

          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent": UA})
              with urllib.request.urlopen(req, timeout=15) as r:
                  body = r.read()
              if not body.strip():
                  # WU vrne prazno telo (HTTP 204), kadar postaja nima trenutne meritve
                  raise ValueError("prazen odgovor (vir nima trenutne meritve)")
              return json.loads(body)

          def now():
              return datetime.now(timezone.utc)

          def check_wu():
              try:
                  obs = fetch(WU_URL)["observations"][0]
                  t = datetime.fromisoformat(obs["obsTimeUtc"].replace("Z", "+00:00"))
                  age = int((now() - t).total_seconds() / 60)
                  return ("offline" if age > OFFLINE_MIN else "online"), age, obs["obsTimeUtc"]
              except Exception as e:
                  return "error", None, str(e)

          def check_ew():
              try:
                  d = fetch(EW_URL)
                  if d.get("code") not in (0, None) or "data" not in d:
                      raise ValueError(f"neveljaven odgovor (code={d.get('code')}, error={d.get('error')})")
                  ts = int(d["data"]["outdoor"]["temperature"]["time"])
                  t = datetime.fromtimestamp(ts, timezone.utc)
                  age = int((now() - t).total_seconds() / 60)
                  return ("offline" if age > OFFLINE_MIN else "online"), age, t.strftime("%Y-%m-%dT%H:%M:%SZ")
              except Exception as e:
                  return "error", None, str(e)

          wu = check_wu()
          ew = check_ew()
          print(f"WU:      {wu}")
          print(f"Ecowitt: {ew}")

          def line(name, r):
              status, age, detail = r
              if status == "online":
                  return f"- **{name}**: v redu, zadnja meritev {age} min nazaj ({detail})"
              if status == "offline":
                  return f"- **{name}**: ne oddaja, zadnja meritev {age} min nazaj ({detail})"
              return f"- **{name}**: napaka pri branju — `{detail}`"

          wu_ok = wu[0] == "online"
          ew_ok = ew[0] == "online"
          if wu_ok and ew_ok:
              diag = ""
              status = "online"
          else:
              if not wu_ok and not ew_ok:
                  diag = ("Noben vir ne vrača svežih podatkov. Če sta razloga zastarela meritev ali "
                          "prazen odgovor, je vzrok doma: napajanje ali Wi-Fi konzole, usmerjevalnik "
                          "ali povezava zunanjega senzorja (preverite konzolo in nadzorno ploščo "
                          "Ecowitt). Če gre za napako API-ja, je lahko kriv vir.")
                  title = "Postaja IREICA1 ne oddaja podatkov (Ecowitt in WU)"
              elif not wu_ok:
                  diag = ("Ecowitt podatke prejema, Weather Underground pa ne: postaja deluje, "
                          "težava je pri prenosu na WU ali pri WU.")
                  title = "IREICA1: podatkov ni na Weather Underground (Ecowitt je v redu)"
              else:
                  diag = ("Weather Underground podatke ima, Ecowitt pa ne: preverite Ecowitt API "
                          "in ključe ter delovanje workerja.")
                  title = "IREICA1: podatkov ni na Ecowitt (WU je v redu)"
              status = "offline" if "offline" in (wu[0], ew[0]) else "error"
              body = (
                  "Preverjanje svežosti podatkov (prag " + str(OFFLINE_MIN) + " min):\n\n"
                  + line("Weather Underground", wu) + "\n"
                  + line("Ecowitt", ew) + "\n\n"
                  + diag + "\n"
              )
              with open(os.path.join(os.environ["RUNNER_TEMP"], "issue-body.md"), "w") as f:
                  f.write(body)
              with open(os.path.join(os.environ["RUNNER_TEMP"], "issue-title.txt"), "w") as f:
                  f.write(title)

          ages = [r[1] for r in (wu, ew) if r[1] is not None]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"status={status}\n")
              f.write(f"age={min(ages) if ages else 0}\n")
          PYEOF

      - name: Pripravi oznako
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "station-offline" \
            --repo ${{ github.repository }} \
            --color "E11D48" \
            --description "Postaja IREICA1 ne oddaja podatkov" \
            --force

      - name: Odpri opozorilo (postaja ne oddaja)
        if: steps.check.outputs.status != 'online'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OPEN=$(gh issue list \
            --repo ${{ github.repository }} \
            --label "station-offline" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -z "$OPEN" ]; then
            gh issue create \
              --repo ${{ github.repository }} \
              --title "$(cat "$RUNNER_TEMP/issue-title.txt")" \
              --body-file "$RUNNER_TEMP/issue-body.md" \
              --label "station-offline"
          fi

      - name: Zapri opozorilo (postaja spet oddaja)
        if: steps.check.outputs.status == 'online'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AGE="${{ steps.check.outputs.age }}"

          OPEN=$(gh issue list \
            --repo ${{ github.repository }} \
            --label "station-offline" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" \
              --repo ${{ github.repository }} \
              --body "Postaja spet oddaja podatke (Weather Underground in Ecowitt). Zadnja meritev je bila **${AGE} min** nazaj."
            gh issue close "$OPEN" --repo ${{ github.repository }}
          fi
