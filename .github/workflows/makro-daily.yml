name: Makro arhiv — dnevna objava

on:
  schedule:
    # 04:15 UTC -- po dnevnem članku (03:45) in pred večino ostalih jutranjih
    # avtomatizacij, da se ne prerivajo za isti push na main.
    - cron: '15 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = samo izpiši, kaj bi se objavilo, brez zapisa/objave'
        required: false
        default: 'false'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Namesti odvisnosti
        run: pip install Pillow PyYAML --quiet

      - name: Objavi eno čakajočo fotko iz makro-inbox/
        if: inputs.dry_run != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INATURALIST_API_TOKEN: ${{ secrets.INATURALIST_API_TOKEN }}
        run: python3 tools/generate_makro_post.py --wire

      - name: Predogled (--dry-run, brez zapisa)
        if: inputs.dry_run == 'true'
        run: python3 tools/generate_makro_post.py --dry-run

      - name: Commit & push
        id: commit
        if: inputs.dry_run != 'true'
        run: |
          git config user.name  "meteorec-bot"
          git config user.email "bot@meteorec.si"
          git add makro/ makro-inbox/ img/makro/ data/makro.json sitemap-makro.xml og/
          if git diff --cached --quiet; then
            echo "Ni sprememb (nabiralnik prazen ali brez določene vrste)."
            echo "published=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          git commit -m "makro: nova objava $(date -u +%Y-%m-%d) [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "published=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "Push zavrnjen (poskus $i/5) -- rebase na najnovejši main in ponovni poskus …"
            git fetch origin main
            git rebase origin/main
            sleep $((i * 3))
          done
          echo "Push ni uspel po 5 poskusih." >&2
          exit 1

      - name: IndexNow — obvesti iskalnike o novi strani
        if: steps.commit.outputs.published == 'true'
        run: |
          python3 - <<'PYEOF'
          import json, urllib.request, urllib.error, sys

          cat = json.load(open("data/makro.json", encoding="utf-8"))
          species = sorted(cat["species"], key=lambda s: s["last_seen"], reverse=True)
          if not species:
              sys.exit(0)
          url = f"https://meteorec.si{species[0]['url']}"

          KEY = "d4e7a1b3c9f2e5d8a0b6c3f7e2d1a4b9"
          payload = json.dumps({
              "host": "meteorec.si",
              "key": KEY,
              "keyLocation": f"https://meteorec.si/{KEY}.txt",
              "urlList": [url, "https://meteorec.si/sitemap-makro.xml"],
          }).encode()

          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=10) as r:
                  print(f"IndexNow: {r.status} — {url}")
          except urllib.error.HTTPError as e:
              body = e.read().decode("utf-8", "replace")[:200]
              print(f"IndexNow napaka {e.code}: {body}", file=sys.stderr)
          PYEOF
