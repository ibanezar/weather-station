name: Učenje lastnega modela (MOS)

on:
  schedule:
    # 1. v mesecu ob 02:00 UTC. Pogosteje nima smisla: mesec dni novih meritev
    # premakne koeficiente komaj zaznavno, zajem arhiva napovedi pa je težak.
    - cron: '0 2 1 * *'
  workflow_dispatch: {}

jobs:
  train:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Brez predpomnilnika: v CI ga tako ali tako ni, zajem pa je nekaj minut.
      # --use-bias-tmin/--use-cond-tmin: validacija (data/mtr-validation-report.md)
      # je pokazala izboljšavo za tmin na celotnem obdobju pri vseh vodilnih
      # časih; pri tmaxu je zaradi kratke učne zgodovine (2-3 pretekle jeseni)
      # sezona "jesen" poslabšala, zato tmax ostane na osnovnih značilkah.
      # --multi-tmax (6. 10. 2026): Tmax drugih modelov (data/forecast-archive.csv) kot
      # značilke za tmax. Walk-forward v okviru train_recica_mos: Tmax D+1 1,11→1,04,
      # D+2 1,34→1,24, D+3 1,53→1,40 °C; uparjen bootstrap (tools/ai/eval_significance.py)
      # potrdi D+2 in D+3. Pri tminu je dobiček šum, zato tam ni vklopljeno.
      - name: Nauči model in izmeri veščino
        run: python3 tools/train_recica_mos.py --no-cache --use-bias-tmin --use-cond-tmin --multi-tmax

      - name: Commit & push if changed
        run: |
          git config user.name  "meteorec-bot"
          git config user.email "bot@meteorec.si"
          git add model/recica-mos.json || true
          git diff --cached --quiet && echo "Ni sprememb." && exit 0
          git commit -m "chore: znova nauči lokalni MOS model $(date -u +%Y-%m-%d) [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push zavrnjen (poskus $i/5) -- rebase na najnovejši main in ponovni poskus …"
            git fetch origin main
            git rebase origin/main
            sleep $((i * 3))
          done
          echo "Push ni uspel po 5 poskusih." >&2
          exit 1
