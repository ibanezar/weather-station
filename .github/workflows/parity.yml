name: Test usklajenosti podvojitev

# CLAUDE.md na ducatu mest pravi »če spremeniš eno, spremeni drugo« (Python ↔ JS,
# worker ↔ klient). Ta test to preverja: JS funkcije izreže iz pravih datotek in
# jih poganja na istih vhodih kot Python kopijo. Teče ob vsaki spremembi katere
# od kopij, da razhajanje ujame PR, ne bralec. Glej tools/test_parity.py.

on:
  pull_request:
    paths:
      - 'app.js'
      - 'worker.js'
      - 'igra/**'
      - 'napovej/**'
      - 'crnivec-igra/**'
      - 'crnivec-site/**'
      - 'gobarska-napoved/index.html'
      - 'meteogasilec/gasilec.js'
      - 'tools/**'
      - '.github/workflows/parity.yml'
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'worker.js'
      - 'igra/**'
      - 'napovej/**'
      - 'crnivec-igra/**'
      - 'meteogasilec/gasilec.js'
      - 'tools/**'
      - '.github/workflows/parity.yml'
  workflow_dispatch: {}

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # generate_crnivec_page.py uvozi generate_story_card.py (Pillow), gobe_model.py pa PyYAML.
      - name: Odvisnosti
        run: pip install Pillow PyYAML --quiet

      - name: Test usklajenosti kopij
        run: python3 tools/test_parity.py

      - name: Test preverjanja nevihtne karte
        run: python3 tools/test_storm_verify.py

      - name: Test zaznave nevihtnih dogodkov
        run: python3 tools/test_storm_events.py

      - name: Test vremena v gorah
        run: python3 tools/test_gore.py

      - name: Test žleda
        run: python3 tools/test_freezing_rain.py

      - name: Test časovnih vrat dnevnih kart
        run: python3 tools/test_gates.py

      - name: Test varuha svežine
        run: python3 tools/test_freshness.py

      - name: Test posnetka ARSO rr24h
        run: python3 tools/test_precip_snapshot.py

      - name: Test LightningLogger (ponovna vzpostavitev, zombi)
        run: python3 tools/test_lightning_logger.py

      - name: Test dolinskega profila
        run: python3 tools/test_valley_profile.py

      - name: Test ovoja fetch() za Open-Meteo arhiv (predpomnilnik, vrsta, 429)
        run: node tools/test_om_fetch.mjs

      - name: Test potrošnikov datotek drugih workflowov (zastareli vhodi)
        run: python3 tools/test_stale_inputs.py

      - name: Test sezonskega vodiča in uvrstitve meseca
        run: python3 tools/test_sezona.py

      - name: Test napovedi MTR (verjetnost zmrzali, režim noči), urnega zajema in ansamblov
        run: |
          python3 tools/test_mtr_extras.py
          python3 tools/test_hourly_log.py
          python3 tools/test_ensemble_log.py

      - name: Test User-Agenta pri klicih workerja
        run: python3 tools/test_worker_ua.py

      - name: Test objavljanja na FB/IG (nov članek, UTM, dvojniki)
        run: python3 tools/test_social_post.py

      - name: Test opažanj bralcev v gobarskem modelu (stikalo, strogost signala)
        run: python3 tools/test_gobe_observations.py
