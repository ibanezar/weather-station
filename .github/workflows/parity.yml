name: Test usklajenosti podvojitev

# CLAUDE.md na ducatu mest pravi »če spremeniš eno, spremeni drugo« (Python ↔ JS,
# worker ↔ klient). Ta test to preverja: JS funkcije izreže iz pravih datotek in
# jih poganja na istih vhodih kot Python kopijo. Teče ob vsaki spremembi katere
# od kopij, da razhajanje ujame PR, ne bralec. Glej tools/test_parity.py.

on:
  pull_request:
    paths:
      - 'app.js'
      - 'style.css'
      - 'worker.js'
      - '365-0-game/src/engine/**'
      - 'podjetja/**'
      - 'tools/generate_podjetja_page.py'
      - 'igra/**'
      - 'napovej/**'
      - 'crnivec-igra/**'
      - 'crnivec-site/**'
      - 'gobarska-napoved/index.html'
      - 'meteogasilec/gasilec.js'
      - 'tools/**'
      - '.github/workflows/parity.yml'
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'style.css'
      - 'worker.js'
      - '365-0-game/src/engine/**'
      - 'igra/**'
      - 'napovej/**'
      - 'crnivec-igra/**'
      - 'meteogasilec/gasilec.js'
      - 'tools/**'
      - '.github/workflows/parity.yml'
  workflow_dispatch: {}

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # generate_crnivec_page.py uvozi generate_story_card.py (Pillow), gobe_model.py pa PyYAML.
      - name: Odvisnosti
        run: pip install Pillow PyYAML openpyxl numpy --quiet

      - name: Test usklajenosti kopij
        run: python3 tools/test_parity.py

      - name: Test tipografske lestvice hero kartice
        run: python3 tools/test_hero_tipografija.py

      - name: Test barvne skale temperature (podatkovna barva ≠ znamčni cian)
        run: python3 tools/test_temp_barve.py

      - name: Test hierarhije ploščic in lestvic hero kartice
        run: python3 tools/test_hero_ploscice.py

      - name: Test kartice »Zakaj je danes takšno vreme?« (tri ploščice, pogoji, brez emoji)
        run: python3 tools/test_why_card.py

      - name: Test preverjanja nevihtne karte
        run: python3 tools/test_storm_verify.py

      - name: Test zaznave nevihtnih dogodkov
        run: python3 tools/test_storm_events.py

      - name: Test vremena v gorah
        run: python3 tools/test_gore.py

      - name: Test »Sonce v dolini« in »Jutro v dolini« (obzorje, sončna pot, zamik, zapis 5-minutnih meritev)
        run: python3 tools/test_sonce.py

      - name: Test strani o velikem vremenu (indeksi, stratosfera, prah, sinoptična karta)
        run: python3 tools/test_atmos.py

      - name: Test cevovoda lastnega WRF (domene, namelisti, izbira polj GFS, DEM, izvleček, verifikacija)
        run: |
          pip install netCDF4 --quiet
          python3 tools/test_wrf.py

      - name: Test strani Vreme in astma (točkovanje, JS kopija, brez notranjih meritev)
        run: python3 tools/test_astma.py

      - name: Test strani »vreme za …« (točkovanje, veto, okno po urah, izris)
        run: |
          python3 tools/test_day_pages.py
          python3 tools/test_migrena.py
          python3 tools/test_sklepi.py
          node tools/test_migrena_alarm.mjs
          node tools/test_ocene.mjs
          python3 tools/test_zima_alarm.py

      - name: Test žleda
        run: python3 tools/test_freezing_rain.py

      - name: Test časovnih vrat dnevnih kart
        run: python3 tools/test_gates.py

      - name: Test varuha svežine
        run: python3 tools/test_freshness.py

      - name: Test posnetka ARSO rr24h
        run: python3 tools/test_precip_snapshot.py

      - name: Test LightningLogger (ponovna vzpostavitev, zombi)
        run: python3 tools/test_lightning_logger.py

      - name: Test dolinskega profila
        run: python3 tools/test_valley_profile.py

      - name: Test ploščice PM2,5 (Varpolje)
        run: python3 tools/test_pm_tile.py

      - name: Test verjetnosti padavin po pragovih (MTR pop1/pop5)
        run: python3 tools/test_pop_thresholds.py

      - name: Test količine padavin MTR (povprečje virov)
        run: python3 tools/test_precip_amount.py

      - name: Test igre Gobarski detektiv
        run: python3 tools/test_detektiv.py

      - name: Test ovoja fetch() za Open-Meteo arhiv (predpomnilnik, vrsta, 429)
        run: node tools/test_om_fetch.mjs

      - name: Test končne točke /anketa (pravi worker.js, lažen R2/KV)
        run: node tools/test_anketa.mjs

      - name: Test strani /podjetja/ in končne točke /api/povprasevanje
        run: |
          python3 tools/test_podjetja.py
          node tools/test_podjetja_worker.mjs

      - name: Test varovalk javnih vnosov (push naslovi, omejitve po IP, zgornje meje)
        run: node tools/test_worker_abuse.mjs

      - name: Test pravil slogovnega pregleda (lektura_scan)
        run: python3 tools/test_lektura_scan.py

      - name: Test avtorizacije končnih točk (premium, webhook, admin, skrivnosti)
        run: node tools/test_worker_auth.mjs

      - name: Test rezerve za /hourly (WU 401 → Ecowitt, grafi ne obstanejo v »Nalaganje…«)
        run: node tools/test_hourly_fallback.mjs

      - name: Test vrat pozebe, igre, povzetka in zgodovine
        run: python3 tools/test_gates_daily.py
      - name: Navedba vira ARSO
        run: python3 tools/test_arso_vir.py

      - name: Test bloka »Na kratko« na hub straneh (klima, padavine, temperatura, rekord)
        run: python3 tools/test_hub_kratko.py

      - name: Test llms-full.txt
        run: python3 tools/test_llms_full.py

      - name: Test bloka »Na kratko« na /tocnost-napovedi/
        run: python3 tools/test_tocnost_answer.py

      - name: Test zimskega cevovoda na sintetični zimi (sneg, žled, gore, strani)
        run: python3 tools/test_winter_scenario.py

      - name: Test potrošnikov datotek drugih workflowov (zastareli vhodi)
        run: python3 tools/test_stale_inputs.py

      - name: Test žive napovedi MTR (zamrznjena ostane nedotaknjena)
        run: python3 tools/test_mtr_live.py

      - name: Test MTR sneg (proksi) - značilke, učenje, sezona, dnevnik, preverjanje naprej
        run: |
          pip install numpy
          python3 tools/test_sneg_mos.py

      - name: Test števcev odprtih poskusov MTR (Čaka na podatke)
        run: python3 tools/test_mtr_pending.py

      - name: Test strani /mtr/ in kartic Kuhinja (generator = committano, skripte obstajajo)
        run: python3 tools/test_mtr_page.py

      - name: Test sezonskega vodiča in uvrstitve meseca
        run: python3 tools/test_sezona.py

      - name: Test krajevnih strani (statična meritev, smer postaje, naslov)
        run: python3 tools/test_town_pages.py

      - name: Test vremenskih pojmov (/pojmi/)
        run: python3 tools/test_pojmi.py

      - name: Test napovedi MTR (verjetnost zmrzali, režim noči), urnega zajema, ansamblov in profila
        run: |
          python3 tools/test_mtr_extras.py
          python3 tools/test_hourly_log.py
          python3 tools/test_ensemble_log.py
          python3 tools/test_profile_log.py
          python3 tools/test_mtr_wind.py

      - name: Test napovedi ur, zasidrane na meritev (junaška krivulja)
        run: python3 tools/test_anchor.py

      - name: Test User-Agenta pri klicih workerja
        run: python3 tools/test_worker_ua.py

      - name: Test objavljanja na FB/IG (nov članek, UTM, dvojniki)
        run: python3 tools/test_social_post.py

      - name: Test opažanj bralcev v gobarskem modelu (stikalo, strogost signala)
        run: python3 tools/test_gobe_observations.py

      - name: Test ročnih umeritev vrst (CALIBRATION v species_rules.yaml)
        run: python3 tools/test_species_calibration.py

      - name: Test Gobjega alarma (pravila, histereza, hladilna doba)
        run: node tools/test_gobe_alarm.mjs

      - name: Test odločitvene logike čuvaja videza
        run: node tools/test_visual_watch.mjs

      - name: Test beleženja sevanja soseda in primerjave prvega žarka
        run: python3 tools/test_varpolje_solar.py

      - name: Test izvoza podatkov (CSV), objave na Zenodo in sheme Dataset
        run: python3 tools/test_dataset_export.py

      - name: Test analize »dvig megle po sevanju« (negativen rezultat)
        run: python3 tools/test_megla_sevanje.py

      - name: Test anonimnega štetja iger 365-0 (pravi worker.js, lažen KV)
        run: node tools/test_g365_stat.mjs
