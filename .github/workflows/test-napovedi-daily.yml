name: Test napovedi — dnevni zajem

on:
  schedule:
    # 01:50 UTC — po update-history.yml (01:15, včerajšnja meritev je v
    # history.json) in po forecast-verify.yml (01:35), da se izogneva sočasnemu
    # pushu na main (oba imata rebase+retry, a manj kolizij je bolje).
    - cron: '50 1 * * *'
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # past-days je majhen -- poln arhiv nazaj (past-days=820) je bil enkraten
      # backfill; dnevni tek samo dopolni zadnjih ~10 dni (starejši dnevi so
      # itak že v data/forecast-archive.csv, load_existing() jih preskoči).
      - name: Dopolni arhiv napovedi (Open-Meteo Previous Runs)
        run: python3 tools/build_forecast_archive.py --past-days 10

      - name: Zabeleži napoved ARSO in Yr (MET Norway)
        run: python3 tools/log_forward_forecasts.py

      # Ansambli nimajo arhiva nazaj — zgodovina se nabira samo s tekočim zajemom.
      - name: Zabeleži ansamble (ECMWF ENS, ICON-EPS, GEFS)
        continue-on-error: true
        run: python3 tools/log_ensemble_forecasts.py

      # Višinski profil, sloji oblačnosti, sneg in mejna plast nimajo arhiva napovedi izpred N dni
      # (eval_mtr4, docs/model-recica.md) — prave napovedi se nabirajo samo s tekočim zajemom.
      - name: Zabeleži napovedi profila (T925/T850, sloji oblačnosti, sneg, mejna plast)
        continue-on-error: true
        run: python3 tools/log_profile_forecasts.py

      - name: Zabeleži urne meritve (za bodočo analizo pristranskosti)
        run: python3 tools/log_hourly_observations.py

      # 5-minutno sevanje in temperatura ob vzhodu/zahodu: preverjanje modela obzorja (/sonce-v-dolini/).
      # Ecowitt hrani polno ločljivost ~90 dni, zato samo sproti (backfill: hourly-backfill.yml).
      - name: Zabeleži 5-minutno sevanje ob vzhodu in zahodu, preveri model obzorja
        continue-on-error: true
        run: |
          pip install numpy --quiet
          python3 tools/log_solar_5min.py
          python3 tools/eval_sonce.py
          python3 tools/generate_sonce_page.py

      # Sevanje sosednje postaje (IREICA7, Varpolje): worker ga vsakih 5 min zapiše v R2 (72 h), tu ga prenesemo in primerjamo
      # čas prvega žarka z IREICA1 (domneva »senzor stoji v senci«, CLAUDE.md). Sosed je gost: samo ta primerjava.
      - name: Prenesi sevanje soseda in primerjaj prvi žarek obeh postaj
        continue-on-error: true
        run: |
          python3 tools/log_varpolje_solar.py
          python3 tools/eval_sonce_varpolje.py

      - name: Izračunaj metrike
        run: python3 tools/compute_forecast_test_metrics.py

      - name: Generiraj stran /test-napovedi/ in podatki.csv
        run: python3 tools/generate_test_napovedi_page.py

      - name: Generiraj stran /primerjava-modelov/ (tabela »kdo je držal«)
        run: python3 tools/generate_primerjava_modelov_page.py

      - name: Commit & push if changed
        run: |
          git config user.name  "meteorec-bot"
          git config user.email "bot@meteorec.si"
          git add data/forecast-archive.csv data/forecast-forward-log.csv \
                  data/hourly-observations.csv data/ensemble-forward-log.csv data/profile-forward-log.csv data/solar-5min.csv data/sonce-preverjanje.json data/varpolje-solar-5min.csv data/sonce-varpolje.json sonce-v-dolini/ data/test-napovedi.json test-napovedi/ primerjava-modelov/
          git diff --cached --quiet && echo "Ni sprememb." && exit 0
          git commit -m "test-napovedi: dnevni zajem $(date -u +%Y-%m-%d) [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push zavrnjen (poskus $i/5) -- rebase na najnovejši main in ponovni poskus …"
            git fetch origin main
            git rebase origin/main
            sleep $((i * 3))
          done
          echo "Push ni uspel po 5 poskusih." >&2
          exit 1
