name: Pre-render trenutne meritve

on:
  schedule:
    - cron: '30 * * * *'   # vsako uro ob :30 (zamaknjeno od station-monitor)
  workflow_dispatch:

# Prepreči prekrivanje zagonov
concurrency:
  group: prerender-current
  cancel-in-progress: false

jobs:
  prerender:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Vbrizgaj trenutno meritev v index.html in pristajalno stran
        run: python3 tools/inject_current_weather.py --live

      # Napoved (7 dni + po urah) na pristajalno stran. Ob nedosegljivem
      # Open-Meteo pusti staro napoved in konča z 0 — raje malo stara napoved
      # kot prazna stran.
      - name: Vbrizgaj napoved na pristajalno stran
        run: python3 tools/inject_forecast.py

      - name: Commit in push (samo če so spremembe)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          PATHS="index.html vreme-recica-ob-savinji/index.html"
          if git diff --quiet -- $PATHS; then
            echo "Brez sprememb."
          else
            git add $PATHS
            git commit -m "chore: pre-render trenutne meritve [skip ci]"
            for i in 1 2 3 4 5; do
              git push && exit 0
              echo "Push zavrnjen, poskus $i — rebase na origin/main in ponovi."
              git pull --rebase origin main
            done
            git push
          fi
