name: Vremensko leto — letni pregled (1. oktobra)

on:
  schedule:
    # 1. oktobra, po update-history.yml (ta zaradi zamud GitHubovega crona teče
    # ob ~07:00 UTC). Če history.json 30. 9. še nima, tek ne objavi (MIN_DAYS) in
    # ga ponovi drugi termin. Dvakratna objava ni mogoča (skript preskoči
    # obstoječ članek).
    - cron: '20 9 1 10 *'
    - cron: '20 15 1 10 *'
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Namesti odvisnosti
        run: pip install Pillow --quiet

      - name: Generiraj letni pregled (z lekturo) in objavi
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 tools/generate_year_review_post.py --wire

      - name: Commit & push
        id: commit
        run: |
          git config user.name  "meteorec-bot"
          git config user.email "bot@meteorec.si"
          git add blog/ blog.json sitemap.xml og/ i/
          if git diff --cached --quiet; then
            echo "Ni sprememb."
            echo "published=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          git commit -m "blog: vremensko leto $(date -u +%Y) [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "published=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "Push zavrnjen (poskus $i/5) -- rebase na najnovejši main in ponovni poskus …"
            git fetch origin main
            git rebase origin/main
            sleep $((i * 3))
          done
          echo "Push ni uspel po 5 poskusih." >&2
          exit 1

      # Objava NAMENOMA ne gre samodejno na FB/IG (isto kot mesečni test napovedi)
      # -- nova vrsta vsebine, prva objava naj gre skozi ročni pregled; na FB/IG
      # jo pošlji ročno s social-repost.yml.
      - name: IndexNow — obvesti iskalnike o novi objavi
        if: steps.commit.outputs.published == 'true'
        run: |
          python3 - <<'PYEOF'
          import json, urllib.request, urllib.error, sys

          posts = json.load(open("blog.json", encoding="utf-8"))
          today_posts = [p for p in posts if p.get("slug", "").startswith("vremensko-leto-")]
          if not today_posts:
              print("Brez novega letnega pregleda za IndexNow.")
              sys.exit(0)

          KEY = "d4e7a1b3c9f2e5d8a0b6c3f7e2d1a4b9"
          url_list = [f"https://meteorec.si{today_posts[0]['url']}"]
          payload = json.dumps({
              "host": "meteorec.si",
              "key": KEY,
              "keyLocation": f"https://meteorec.si/{KEY}.txt",
              "urlList": url_list,
          }).encode()

          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=10) as r:
                  print(f"IndexNow: {r.status} — {len(url_list)} URL-jev")
          except urllib.error.HTTPError as e:
              body = e.read().decode("utf-8", "replace")[:200]
              print(f"IndexNow napaka {e.code}: {body}", file=sys.stderr)
          PYEOF
