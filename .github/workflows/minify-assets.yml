name: Minify assets

on:
  push:
    branches: [main]
    paths:
      - app.js
      - style.css
  workflow_dispatch:

jobs:
  minify:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Namesti odvisnosti
        run: npm ci

      - name: Minificiraj app.js in style.css
        run: npm run minify

      - name: Osveži kritični CSS v index.html
        # Ni nujno: ob napaki ostane prejšnji kritični blok (celoten CSS se naloži vseeno).
        continue-on-error: true
        run: |
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          node tools/critical_css.mjs

      - name: Commit & push if changed
        run: |
          git config user.name  "meteorec-bot"
          git config user.email "bot@meteorec.si"
          git add app.min.js style.min.css index.html
          git diff --cached --quiet && echo "Ni sprememb." && exit 0
          git commit -m "chore: posodobi minificirane datoteke [skip ci]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "Push zavrnjen, poskus $i — rebase na origin/main in ponovi."
            git pull --rebase origin main
          done
          git push
