name: Verifikacija napovedi

on:
  schedule:
    # 01:35 UTC — po update-history.yml (01:15), ko je včerajšnja dnevna
    # meritev že v history.json.
    - cron: '35 1 * * *'
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Mora teči PRED verify_forecasts.py: ta prebere napoved-modela.json in jo
      # zabeleži kot čakajočo napoved našega modela za jutri.
      - name: Napoved lastnega modela (MOS)
        run: python3 tools/predict_recica_mos.py

      - name: Razreši pretekle napovedi in zabeleži novo
        run: python3 tools/verify_forecasts.py

      # AIFS je edini vir na semaforju, ki ima arhiv preteklih napovedi. Zato se
      # dan, ki mu je AIFS ušel (izpad zajema, prehod ob uvedbi vira), lahko
      # zapolni za nazaj. Ne sme podreti workflowa — semafor teče tudi brez tega.
      - name: Zapolni manjkajoče AIFS napovedi iz arhiva
        run: python3 tools/backfill_aifs_verification.py || true

      - name: Generiraj stran /tocnost-napovedi/
        run: python3 tools/generate_tocnost_page.py

      # Igra »Prehiti model« (/napovej/) bere ISTI čakalni seznam napovedi, ki
      # ga je verify_forecasts.py pravkar zapisal za jutri, in razrešene dneve iz
      # forecast_verification.json. Zato teče tu in ne v svojem delavnem toku:
      # drug zajem bi pomenil druge nasprotnike pod istimi imeni.
      - name: Generiraj igro /napovej/ — krog dneva
        run: python3 tools/generate_napovej_page.py

      # Igra obljublja, da igralca meri po istem pravilu kot modele. Ob padcu
      # testa se krog ne objavi.
      - name: Test modela igre /napovej/
        run: node tools/test_napovej.mjs

      # Ločeno od zgornjega semaforja (ta je D+1, dan za dnem): beleži tudi D+2
      # in izračuna rolling 30-dnevni MAE za zavihek "Trendi" (/trendi/).
      - name: Zabeleži točnost MTR (D+1/D+2) in izračunaj rolling MAE
        run: |
          python3 tools/log_mtr_accuracy.py
          python3 tools/compute_mtr_accuracy_metrics.py

      - name: Commit & push if changed
        run: |
          git config user.name  "meteorec-bot"
          git config user.email "bot@meteorec.si"
          # napovej/ mora biti tu naveden posebej — glej opozorilo o novosti.json
          # v CLAUDE.md: skript je pisal, git add pa poti ni pokrival.
          git add forecast_verification.json tools/.forecast_pending.json tocnost-napovedi/ napovej/ napoved-modela.json \
                  data/mtr-accuracy-log.csv tools/.mtr_accuracy_pending.json data/mtr-accuracy.json || true
          git diff --cached --quiet && echo "Ni sprememb." && exit 0
          git commit -m "chore: posodobi verifikacijo napovedi $(date -u +%Y-%m-%d) [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push zavrnjen (poskus $i/5) -- rebase na najnovejši main in ponovni poskus …"
            git fetch origin main
            git rebase origin/main
            sleep $((i * 3))
          done
          echo "Push ni uspel po 5 poskusih." >&2
          exit 1
