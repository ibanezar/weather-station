name: Lighthouse CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Namesti Lighthouse CI
        run: npm install -g @lhci/cli

      - name: Zaženi Lighthouse CI (desktop)
        run: lhci autorun

      # Večina obiska je z mobilnikov, CI pa je do zdaj meril samo desktop
      # (.lighthouserc.json) — mobilna regresija bi šla skozi neopaženo.
      # Prag je namenoma "warn", ne "error": brez izmerjene osnove bi trden
      # prag lahko podrl vsak push zaradi napačnega uganjenega števila.
      # Ko Filip vidi realne rezultate teka, jih lahko zaostri na "error".
      - name: Zaženi Lighthouse CI (mobile)
        run: lhci autorun --config=.lighthouserc.mobile.json
