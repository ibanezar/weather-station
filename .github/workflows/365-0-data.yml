name: 365-0 data

# Fetches 10 years of daily weather per city from the Open-Meteo archive, classifies every day and
# commits the generated game data (world.v1.json, cities.index.json, data-report.md) back to the branch.
#
# Why this runs in Actions: the free API allows ~10,000 weighted calls per day per IP and the full pull
# needs roughly 19,000, so it takes more than one day. Raw responses are kept in the Actions cache (never
# committed) and each run carries on from where the last one stopped.
#
# Start a run by pushing a change under the paths below (for example touching 365-0/.fetch-trigger) or with
# workflow_dispatch. Push triggers are limited to the development branch; on any other branch (including
# main) the job only fills the cache and does not commit.
#
# Interim scope (agreed with the owner): the first run fetches 2021-2025 only, which fits roughly one day of
# quota. The Actions cache is per year, so topping up to 2016-2025 later only fetches the missing years:
# run the workflow with years=2016-2025.
on:
  workflow_dispatch:
    inputs:
      years:
        description: 'Year range to fetch and build, e.g. 2021-2025 or 2016-2025'
        default: '2021-2025'
  push:
    branches: [ccr-e2eca649-o3xopb]
    paths:
      - '.github/workflows/365-0-data.yml'
      - '365-0/.fetch-trigger'
      - '365-0/scripts/**'
      - '365-0/src/engine/thresholds.ts'
      - '365-0/data/cities.seed.json'

permissions:
  contents: write

concurrency:
  group: 365-0-data
  cancel-in-progress: false

defaults:
  run:
    working-directory: 365-0

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 365-0/package-lock.json
      - run: npm ci

      - name: Restore the raw response cache
        uses: actions/cache/restore@v4
        with:
          path: 365-0/scripts/.cache
          key: 365-0-openmeteo-v1-${{ github.run_id }}
          restore-keys: 365-0-openmeteo-v1-

      - name: Fetch and build
        id: fetch
        # Exit code 75 means the rate limit stopped the run; that is expected and not a failure.
        timeout-minutes: 340
        env:
          YEARS: ${{ inputs.years || '2021-2025' }}
        run: |
          set +e
          node scripts/build-data.ts --years="$YEARS" --max-wait-hours=5
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" != 0 ] && [ "$code" != 75 ]; then exit "$code"; fi
          exit 0

      - name: Save the raw response cache
        if: always() && hashFiles('365-0/scripts/.cache/**') != ''
        uses: actions/cache/save@v4
        with:
          path: 365-0/scripts/.cache
          key: 365-0-openmeteo-v1-${{ github.run_id }}

      - name: Summary
        if: always()
        env:
          YEARS: ${{ inputs.years || '2021-2025' }}
        run: |
          from=${YEARS%-*}
          to=${YEARS#*-}
          n=0
          for y in $(seq "$from" "$to"); do
            n=$((n + $(find scripts/.cache -name "$y.json" 2>/dev/null | wc -l)))
          done
          {
            echo "### 365-0 data"
            echo "- Years: $YEARS"
            echo "- City-years cached: $n of $((72 * (to - from + 1)))"
            echo "- Build exit code: ${{ steps.fetch.outputs.code }} (0 = built, 75 = stopped by the rate limit)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "City-years cached for $YEARS: $n"

      - name: Commit generated data
        if: steps.fetch.outputs.code == '0' && github.ref != 'refs/heads/main'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/world.v1.json src/data/cities.index.json docs/data-report.md
          if git diff --cached --quiet; then
            echo "Generated data is unchanged."
          else
            git commit -m "365-0: regenerate world data"
            git pull --rebase origin "$BRANCH"
            git push origin "HEAD:$BRANCH"
          fi
