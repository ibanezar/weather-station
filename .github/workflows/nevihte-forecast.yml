name: Nevihtna napoved

on:
  schedule:
    - cron: '30 5 * * *'   # 5:30 UTC daily, po vodostaj-forecast.yml
  workflow_dispatch:        # allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate nevihte stran
        run: python3 tools/generate_nevihte_page.py

      # generate_nevihte_page.py zgoraj vedno prepiše WX-STORMMAP blok na
      # rezervno besedilo brez slike (glej komentar tam); storm-map.yml jo
      # zjutraj povrne z današnjo karto, a samo znotraj svojega 6:00-8:00
      # okna (tools/storm_map_gate.py, trdi rok 7:00) — če ga zamudi (zamuda
      # GitHubovega crona, glej git zgodovino 31. 8. 2026), je stran do
      # naslednjega dneva brez slike. Zato tu takoj vgradimo zadnjo znano
      # karto (jasno označeno, če ni od danes) — raje star podatek kot
      # prazna stran, isto načelo kot povsod drugod v repozitoriju.
      - name: Vgradi zadnjo znano nevihtno karto
        run: python3 tools/inject_storm_map.py

      - name: Commit & push if changed
        run: |
          git config user.name  "meteorec-bot"
          git config user.email "bot@meteorec.si"
          git add nevihte/ || true
          git diff --cached --quiet && echo "Ni sprememb." && exit 0
          git commit -m "seo: posodobi nevihtno napoved $(date -u +%Y-%m-%d) [skip ci]"
          git push
