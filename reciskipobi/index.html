<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#050805">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zamudometer">
<title>Zamudometer · Rečiški pobi</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#050805;--card:#0d1610;--card2:#122019;--bd:#1f3324;--bd2:#2b4a35;
  --fg:#e4f4e8;--mut:#93ad9a;--ac:#3ddc84;--ac2:#27b86a;--acfg:#03130a;
  --warn:#f4c95d;--bad:#ff8a80;--r:14px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:radial-gradient(900px 420px at 50% -140px,rgba(61,220,132,.17),transparent 70%),var(--bg);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 80px env(safe-area-inset-left)}
.staff{height:33px;margin:14px 0 0;opacity:.55;
  background:repeating-linear-gradient(to bottom,var(--bd2) 0 1px,transparent 1px 8px)}
header.top{display:flex;align-items:center;gap:14px;max-width:640px;margin:0 auto;padding:14px 16px 4px}
header.top img{border-radius:14px;flex:none}
header.top div{flex:1;min-width:0}
h1{margin:0;font-size:1.65rem;line-height:1.15;letter-spacing:.01em;color:var(--ac)}
.sub{margin:2px 0 0;color:var(--mut);font-size:.95rem}
.tagline{max-width:640px;margin:0 auto;padding:4px 16px 10px;color:var(--mut);font-size:.95rem;font-style:italic}
main{max-width:640px;margin:0 auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin:12px 0}
.card h2{margin:0 0 6px;font-size:1.1rem;color:var(--ac)}
.muted{color:var(--mut)}
small,.hint{color:var(--mut);font-size:.88rem}
label,legend{display:block;font-weight:600;margin:0 0 6px;padding:0}
label small,legend small{font-weight:400}
fieldset{border:0;margin:0;padding:0;min-width:0}
.field{margin:0 0 16px}
input[type=text],input[type=password],input[type=date],input[type=number],select,textarea{
  width:100%;padding:11px 12px;font:inherit;font-size:16px;color:var(--fg);background:#08100b;
  border:1px solid var(--bd2);border-radius:10px}
textarea{resize:vertical;min-height:84px}
input::placeholder,textarea::placeholder{color:#6f8a77}
input[type=date]{color-scheme:dark}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button{font:inherit;cursor:pointer;min-height:44px;border-radius:10px;border:1px solid var(--bd2);
  background:var(--card2);color:var(--fg);padding:9px 14px}
button:hover{border-color:var(--ac)}
button:disabled{opacity:.5;cursor:default}
button.primary{width:100%;background:var(--ac);border-color:var(--ac);color:var(--acfg);font-weight:700;font-size:1.05rem}
button.primary:hover{background:#5ee89b}
button.ghost{background:transparent;color:var(--mut);min-height:40px;padding:6px 12px;font-size:.9rem}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
#err{color:var(--bad);min-height:1.4em;margin-top:8px}
#namesti{display:inline-flex;align-items:center;gap:6px;flex:none;color:var(--ac);border-color:var(--bd2);min-width:44px;justify-content:center}
#namesti .t{display:none}
@media(min-width:520px){#namesti .t{display:inline}}
.check{display:flex;gap:10px;align-items:center;font-weight:400;margin:12px 0 0;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--ac);flex:none}

/* zavihki */
[role=tablist]{display:flex;gap:6px;margin:6px 0 4px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:4px}
[role=tab]{flex:1;border:0;background:transparent;color:var(--mut);padding:8px 4px;font-weight:600;font-size:.95rem;min-height:44px;border-radius:9px}
[role=tab][aria-selected=true]{background:var(--ac);color:var(--acfg)}
[role=tab]:hover{color:var(--fg)}
[role=tab][aria-selected=true]:hover{color:var(--acfg)}

/* čipi in izbira */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{min-height:40px;padding:6px 13px;border-radius:999px;background:#08100b;color:var(--fg);font-size:.95rem}
.chip[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:var(--acfg);font-weight:700}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.seg label{margin:0;font-weight:500;position:relative}
.seg input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.seg span{display:block;text-align:center;padding:9px 6px;border:1px solid var(--bd2);border-radius:10px;background:#08100b;min-height:44px;line-height:1.6}
.seg input:checked+span{background:var(--ac);border-color:var(--ac);color:var(--acfg);font-weight:700}
.seg input:focus-visible+span{outline:2px solid var(--ac);outline-offset:2px}
.row2{display:grid;grid-template-columns:1fr;gap:0}
@media(min-width:520px){.row2{grid-template-columns:1fr 1fr;gap:14px}}
.minrow{display:flex;gap:10px;align-items:center;margin-top:10px}
.minrow input{max-width:120px}
.off{opacity:.45;pointer-events:none}
.count{text-align:right;margin-top:2px}

/* generator izgovorov */
.gen{background:var(--card2);border:1px dashed var(--bd2);border-radius:12px;padding:12px;margin:0 0 16px}
.gen .line{display:flex;gap:8px;flex-wrap:wrap}
.gen select{flex:1;min-width:140px}
.gen button.roll{flex:none}
#predlog{margin-top:12px;border-left:3px solid var(--ac);padding:2px 0 2px 12px}
#predlog p{margin:0 0 10px;font-size:1.02rem}
#predlog .btns{display:flex;gap:8px;flex-wrap:wrap}

/* verdikt postaje */
.verdict{margin-top:10px;padding:9px 12px;border-radius:10px;font-size:.93rem;border:1px solid var(--bd2);background:#08100b}
.verdict.ok{border-color:var(--ac2)}
.verdict.bad{border-color:var(--warn);color:#fbe3a2}
.verdict.wait{color:var(--mut)}
.verdict b{display:block;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.verdict.ok b{color:var(--ac)}
.verdict.bad b{color:var(--warn)}

/* rezultat po vnosu */
#rezultat{border-color:var(--ac)}
#rezultat .pen{margin:10px 0 14px;padding:10px 12px;background:var(--card2);border-radius:10px}
#rezultat .pen b{color:var(--warn)}

/* sramotni zid */
.seg2{display:flex;gap:6px;margin:0 0 12px}
.seg2 button{flex:1}
.seg2 button[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:var(--acfg);font-weight:700}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.tile.wide{grid-column:1/-1}
.tile .k{font-size:.8rem;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.tile .v{font-size:1.5rem;font-weight:700;color:var(--ac);line-height:1.2;margin:2px 0}
.tile .s{font-size:.88rem;color:var(--mut)}
.podij{display:grid;grid-template-columns:1fr;gap:10px;margin:0 0 12px}
.pod{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.pod .no{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:var(--acfg);background:var(--ac)}
.pod:nth-child(2) .no{background:#9bd8b4}
.pod:nth-child(3) .no{background:#6ea285}
.pod .nm{font-weight:700;font-size:1.05rem}
.pod .tt{font-size:.88rem;color:var(--mut)}
.pod .pt{margin-left:auto;text-align:right;font-weight:700;color:var(--ac);white-space:nowrap}
.pod .pt small{display:block;font-weight:400}
.rank{list-style:none;margin:0;padding:0}
.rank li{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}
.rank li:first-child{border-top:0}
.rank .n{flex:none;width:26px;color:var(--mut);text-align:right}
.rank .nm{font-weight:600}
.rank .tt{font-size:.85rem;color:var(--mut)}
.rank .pt{margin-left:auto;text-align:right;white-space:nowrap}
.rank .pt small{display:block}

/* dnevnik */
.log{list-style:none;margin:0;padding:0}
.entry{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:13px;margin:0 0 10px}
.e-head{display:flex;gap:10px;align-items:baseline;justify-content:space-between}
.e-head strong{font-size:1.05rem}
.pill{flex:none;background:var(--card2);border:1px solid var(--bd2);border-radius:999px;padding:1px 10px;font-size:.88rem;color:var(--ac);white-space:nowrap}
.pill.duh{color:var(--warn)}
.e-meta{color:var(--mut);font-size:.88rem;margin:0 0 6px}
.e-why{margin:0 0 4px;font-style:italic}
.e-pen{margin:8px 0 0;font-size:.9rem;color:var(--mut)}
.e-pen b{color:var(--warn);font-weight:600}
.e-foot{display:flex;justify-content:flex-end;margin-top:6px}
.empty{text-align:center;color:var(--mut);padding:26px 8px}

/* črne pike (narisane kot zvezdice) */
.gz{display:inline-flex;align-items:center;gap:1px;vertical-align:middle}
.gz svg{width:19px;height:19px;flex:none;overflow:visible}
.gz-tot{display:inline-flex;align-items:center;gap:5px;color:var(--mut);font-size:.88rem}
.gz-tot svg{width:16px;height:16px;transform:rotate(-8deg);flex:none}
.e-gz{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:.88rem;color:var(--mut)}
.rez-gz{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.rez-gz .gz svg{width:26px;height:26px}
.rez-gz b{color:var(--warn);font-weight:600}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;
  background:var(--ac);color:var(--acfg);font-weight:600;padding:11px 18px;border-radius:12px;max-width:min(92vw,520px);
  text-align:center;pointer-events:none;transition:opacity .25s,transform .25s;z-index:10}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:#3a1511;color:#ffd5cf;border:1px solid var(--bad)}
footer{max-width:640px;margin:26px auto 0;padding:0 16px;color:var(--mut);font-size:.82rem;text-align:center}

@keyframes tik{to{transform:rotate(360deg)}}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--bd2);border-top-color:var(--ac);border-radius:50%;animation:tik .8s linear infinite;vertical-align:-2px;margin-right:8px}
@media (prefers-reduced-motion:reduce){.spin{animation:none}#toast{transition:none}}
[hidden]{display:none!important}
</style>
</head>
<body>
<!-- Črna pika v obliki grde zvezdice: nesimetrična, z razpoko in plesnijo. Narisana enkrat, uporabljena z <use>. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="gz" viewBox="0 0 24 24">
    <path d="M12 1.5 L14.6 8.4 L22.5 9.2 L16.4 13.9 L18.6 22.2 L11.6 17.6 L4.4 22.6 L7.4 14.2 L1.2 8.9 L9.2 8.2 Z" fill="#8f9a2e" stroke="#1f2508" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M12 5 L11 11 L13.2 14.4" fill="none" stroke="#1f2508" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="15.4" cy="14.4" r="1.7" fill="#5d6a1c"/>
    <circle cx="8.6" cy="11.2" r="1" fill="#5d6a1c"/>
  </symbol>
</svg>
<div class="staff" aria-hidden="true"></div>
<header class="top">
  <img src="icon.svg" width="56" height="56" alt="">
  <div>
    <h1>Zamudometer</h1>
    <p class="sub">Rečiški pobi · dnevnik zamud</p>
  </div>
  <button id="namesti" type="button" class="ghost" hidden aria-label="Namesti aplikacijo">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
    <span class="t">Namesti</span>
  </button>
  <button id="odjava" type="button" class="ghost" hidden>Odjava</button>
</header>
<p class="tagline" id="tagline"></p>

<main>
<noscript><div class="card">Brez JavaScripta se zamude ne dajo zapisati. Tenorji, žal.</div></noscript>

<section id="login" class="card" aria-labelledby="loginH">
  <h2 id="loginH">Samo za pevce</h2>
  <p class="muted">Geslo ti je povedal zborovodja, ali pa si ga ujel pri pavzi.</p>
  <form id="loginForm" novalidate>
    <div class="field">
      <label for="pw">Geslo zbora</label>
      <input id="pw" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false">
    </div>
    <label class="check"><input type="checkbox" id="zapomni" checked> Ostani prijavljen na tej napravi</label>
    <div id="err" role="alert"></div>
    <button class="primary" id="vstopi" type="submit">Vstopi</button>
  </form>
</section>

<section id="app" hidden>
  <div role="tablist" aria-label="Razdelki">
    <button role="tab" id="t-vpisi" aria-controls="p-vpisi" aria-selected="true" type="button" data-tab="vpisi">Vpiši</button>
    <button role="tab" id="t-zid" aria-controls="p-zid" aria-selected="false" type="button" data-tab="zid">Sramotni zid</button>
    <button role="tab" id="t-dnevnik" aria-controls="p-dnevnik" aria-selected="false" type="button" data-tab="dnevnik">Dnevnik</button>
  </div>

  <!-- VPIŠI -->
  <div id="p-vpisi" role="tabpanel" aria-labelledby="t-vpisi">
    <div id="rezultat" class="card" hidden tabindex="-1">
      <h2>Zapisano!</h2>
      <div class="rez-gz" id="rez-gz"></div>
      <p id="rez-quip"></p>
      <div class="pen"><b>Predlog kazni:</b> <span id="rez-kazen"></span></div>
      <button type="button" id="rez-se" class="primary">Vpiši še eno zamudo</button>
    </div>

    <form id="forma" class="card" novalidate autocomplete="off">
      <div class="field">
        <label for="kdo">Kdo je zamudil?</label>
        <input id="kdo" type="text" maxlength="40" placeholder="Ime pevca" autocomplete="off" autocapitalize="words">
        <div class="chips" id="imena" role="group" aria-label="Znani zamudniki"></div>
      </div>

      <div class="row2">
        <div class="field">
          <label for="datum">Kdaj?</label>
          <input id="datum" type="date">
        </div>
        <fieldset class="field">
          <legend>Kaj je bilo?</legend>
          <div class="seg" id="dogodek">
            <label><input type="radio" name="dogodek" value="vaja" checked><span>Vaja</span></label>
            <label><input type="radio" name="dogodek" value="nastop"><span>Nastop</span></label>
            <label><input type="radio" name="dogodek" value="gostovanje"><span>Gostovanje</span></label>
            <label><input type="radio" name="dogodek" value="druzenje"><span>Druženje</span></label>
          </div>
        </fieldset>
      </div>

      <fieldset class="field" id="minBox">
        <legend>Za koliko minut?</legend>
        <div class="chips" id="minChips" role="group" aria-label="Hitra izbira minut">
          <button type="button" class="chip" data-m="5" aria-pressed="false">5</button>
          <button type="button" class="chip" data-m="10" aria-pressed="false">10</button>
          <button type="button" class="chip" data-m="15" aria-pressed="false">15</button>
          <button type="button" class="chip" data-m="30" aria-pressed="false">30</button>
          <button type="button" class="chip" data-m="45" aria-pressed="false">45</button>
          <button type="button" class="chip" data-m="60" aria-pressed="false">60</button>
        </div>
        <div class="minrow">
          <input id="minute" type="number" inputmode="numeric" min="1" max="240" placeholder="točno" aria-label="Minute zamude">
          <span class="muted">minut</span>
        </div>
      </fieldset>
      <label class="check" style="margin:-4px 0 16px"><input type="checkbox" id="izostal"> Sploh ga ni bilo (duh vaje, šteje kot 60 minut)</label>

      <div class="field">
        <label for="zakaj">Zakaj? <small>Resnica ni obvezna, izvirnost je.</small></label>
        <textarea id="zakaj" maxlength="200" rows="3" placeholder="Krava je prečkala cesto …"></textarea>
        <div class="count hint"><span id="stevec">0</span>/200</div>
        <div id="verdictLive" hidden></div>
      </div>

      <div class="gen">
        <label for="kat" style="font-weight:600">Zmanjkalo idej? Pomagamo.</label>
        <div class="line">
          <select id="kat" aria-label="Vrsta izgovora"></select>
          <button type="button" id="predlagaj" class="roll">🎲 Predlagaj izgovor</button>
        </div>
        <div id="predlog" hidden>
          <p id="predlogTekst"></p>
          <div class="btns">
            <button type="button" id="uporabi" class="chip" style="background:var(--ac);color:var(--acfg);border-color:var(--ac);font-weight:700">Uporabi</button>
            <button type="button" id="se" class="chip">Še en</button>
          </div>
        </div>
      </div>

      <input class="hp" type="text" id="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button class="primary" id="oddaj" type="submit">Zapiši v kroniko sramote</button>
    </form>
  </div>

  <!-- SRAMOTNI ZID -->
  <div id="p-zid" role="tabpanel" aria-labelledby="t-zid" hidden>
    <div class="seg2" role="group" aria-label="Obdobje">
      <button type="button" data-p="month" aria-pressed="true">Ta mesec</button>
      <button type="button" data-p="all" aria-pressed="false">Vse skupaj</button>
    </div>
    <div id="zid"></div>
  </div>

  <!-- DNEVNIK -->
  <div id="p-dnevnik" role="tabpanel" aria-labelledby="t-dnevnik" hidden>
    <div class="field">
      <label for="filter">Pokaži</label>
      <select id="filter"><option value="">Vse zamudnike</option></select>
    </div>
    <ul class="log" id="seznam"></ul>
    <button type="button" id="vec" style="width:100%" hidden>Pokaži starejše</button>
  </div>
</section>
</main>

<footer>Zamudometer je šala, zapisi pa so resnični. Pogled imajo samo tisti z geslom. Vreme je s postaje IREICA1.</footer>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";
var PROXY="https://weatherireica1.filip-eremita.workers.dev";
var SK="zbor-geslo", NBSP=" ", PAGE=25;
var DOGODKI={vaja:"Vaja",nastop:"Nastop",gostovanje:"Gostovanje",druzenje:"Druženje"};

/* ───────── besedila ───────── */
var TAGLINES=[
  "Pesem se začne ob osmih. Ti si se začel ob pol devetih.",
  "Točnost je vrlina tistih, ki jim zmanjka izgovorov.",
  "Vsaka zamuda je pavza, ki je nihče ni naročil.",
  "Tenor zamudi, bas počaka. Tako je v naravi.",
  "Pet minut je akademski četrt. Pol ure je že solo.",
  "Čas je denar. Zbor je čas. Ti si dolžan oboje."
];
var IZGOVORI={
 "Vsakdanji":[
  "Iskal sem ključe. Našel sem jih v roki.",
  "Mislil sem, da je poletni čas še vedno v veljavi.",
  "Pri sosedu sem »samo za minuto« pogledal žar. Žar je šel naprej brez mene.",
  "Na poti sem srečal znanca. Kratek pozdrav, štirideset minut.",
  "Zadnjo žemljo v štacuni sem moral rešiti pred neznanci.",
  "Preoblačil sem se trikrat. Vsakič sem bil manj pripravljen.",
  "Doma so rekli, da imam še čas. Imeli so napačno uro.",
  "Mačka je zaspala na moji jakni in nisem imel srca, da bi jo zbudil."],
 "Promet":[
  "Za traktorjem od Mozirja do Rečice. Dvajset na uro in nobenega ovinka za prehitevanje.",
  "Krava je prečkala cesto. Ne njej ne njeni družini se ni mudilo.",
  "Navigacija me je peljala čez Črnivec. Ne vem, zakaj. Ni bila moja ideja.",
  "Pred mano je vozil nekdo, ki ima rad prvo prestavo.",
  "Zapora na cesti. Obvoz je bil daljši od same poti. Obvoza obvoza sploh ne bi omenjal.",
  "Parkirnega mesta nisem našel. Našel sem pa travnik, potem pa še lastnika.",
  "Čakal sem, da mine čreda ovac. Ovce so imele prednost in so to vedele.",
  "Kolo je imelo drugačne načrte kot jaz. Predvsem pa zračnica."],
 "Vreme":[
  "Dež. Ne takšen, ki moči, ampak takšen, ki vzame voljo.",
  "Megla do kolen, pa še malo više.",
  "Poledica. Pol ure sem se samo spuščal po klančini, nazaj navzgor.",
  "Sneg na avtu. Čiščenje je trajalo dlje kot vožnja.",

function serija(){
  var set={},today=ymd(new Date());
  zapisi.forEach(function(z){if(z.datum<=today)set[z.datum]=1;});
  var ds=Object.keys(set).sort();
  if(!ds.length)return null;
  var day=864e5,cur=Math.max(0,Math.round((parse(today)-parse(ds[ds.length-1]))/day)),rec=cur;
  for(var i=1;i<ds.length;i++)rec=Math.max(rec,Math.round((parse(ds[i])-parse(ds[i-1]))/day));
  return {cur:cur,rec:rec};
}

  var list=zapisi.filter(function(z){return period==="all"||z.datum.slice(0,7)===mesec;});
  if(!list.length){
    root.appendChild(el("div","empty card",period==="all"?"Še nihče ni zamudil. Sumljivo.":"Ta mesec še nihče ni zamudil. Sumljivo."));
    return;
  }
  var m={};
  list.forEach(function(z){
    var k=z.kdo.toLowerCase(),a=m[k]||(m[k]={ime:z.kdo,n:0,min:0,duh:0,zv:0});
    a.n++;a.min+=z.minute||0;if(z.izostal)a.duh++;
    a.zv+=zvezdice(z.minute||0,z.izostal);
  });
  var vrsta=Object.keys(m).map(function(k){var a=m[k];a.tocke=a.min+60*a.duh;return a;});
  vrsta.sort(function(a,b){return b.tocke-a.tocke||b.n-a.n||a.ime.localeCompare(b.ime,"sl");});

  var skupaj=0;list.forEach(function(z){skupaj+=z.minute||0;});
  var pesmi=Math.floor(skupaj/3.5),s=serija();
  var tiles=el("div","tiles");
  tiles.appendChild(tile("Zapisov",String(list.length),pl(vrsta.length,["zamudnik","zamudnika","zamudniki","zamudnikov"])));
  tiles.appendChild(tile("Zamujeno skupaj",fmtMin(skupaj),pesmi?"Toliko, da bi zapeli "+pl(pesmi,["pesem","pesmi","pesmi","pesmi"])+".":"Premalo za eno pesem. Še."));
  if(s)tiles.appendChild(tile("Od zadnje zamude",pl(s.cur,["dan","dneva","dnevi","dni"]),
    (s.cur===0?"Danes je že kdo zamudil. ":"")+"Rekord: "+pl(s.rec,["dan","dneva","dnevi","dni"])+".",true));
  var zvSkupaj=vrsta.reduce(function(s,a){return s+a.zv;},0);
  var zvNaj=vrsta.slice().sort(function(a,b){return b.zv-a.zv||a.ime.localeCompare(b.ime,"sl");})[0];
  tiles.appendChild(tile("Črne pike",String(zvSkupaj),"Največ jih ima "+zvNaj.ime+" ("+zvNaj.zv+"). Belih ni.",true));
  var naj=list.reduce(function(a,z){return(!a||(z.minute||0)>(a.minute||0))?z:a;},null);
  if(naj&&naj.minute)tiles.appendChild(tile("Najdaljša zamuda",naj.kdo+", "+fmtMin(naj.minute),"»"+naj.zakaj+"«",true));
  root.appendChild(tiles);

  var podij=el("div","podij");
  vrsta.slice(0,3).forEach(function(a,i){
    var p=el("div","pod");p.appendChild(el("div","no",String(i+1)));
    var mid=el("div");mid.appendChild(el("div","nm",a.ime));mid.appendChild(el("div","tt",naziv(a.tocke)));mid.appendChild(gzTotal(a.zv));p.appendChild(mid);
    var pt=el("div","pt",fmtMin(a.min));
    pt.appendChild(el("small","",pl(a.n,["zamuda","zamudi","zamude","zamud"])+(a.duh?" · duh ×"+a.duh:"")));
    p.appendChild(pt);podij.appendChild(p);
  });
  root.appendChild(podij);

  if(vrsta.length>3){
    var c=el("div","card"),ol=el("ol","rank");ol.start=4;
    vrsta.slice(3).forEach(function(a,i){
      var li=el("li");li.appendChild(el("span","n",(i+4)+"."));
      var mid=el("div");mid.appendChild(el("div","nm",a.ime));mid.appendChild(el("div","tt",naziv(a.tocke)));mid.appendChild(gzTotal(a.zv));li.appendChild(mid);
      var pt=el("div","pt",fmtMin(a.min));
      pt.appendChild(el("small","muted",pl(a.n,["zamuda","zamudi","zamude","zamud"])+(a.duh?" · duh ×"+a.duh:"")));
      li.appendChild(pt);ol.appendChild(li);
    });
    c.appendChild(ol);root.appendChild(c);
  }
  root.appendChild(el("p","hint","Razvrstitev po točkah sramote: minute zamude + 60 za vsak duh vaje. Črne pike (v obliki zvezdic): do 5 min 1, do 15 min 2, do 30 min 3, do 60 min 4, čez 60 min ali duh vaje 5. Belih pik ne delimo."));
}
document.querySelectorAll(".seg2 button").forEach(function(b){
  b.addEventListener("click",function(){
    period=b.dataset.p;
    document.querySelectorAll(".seg2 button").forEach(function(x){x.setAttribute("aria-pressed",x===b?"true":"false");});
    renderZid();
  });
});

/* ───────── dnevnik ───────── */
function entryEl(z){
  var li=el("li","entry");
  var head=el("div","e-head");head.appendChild(el("strong","",z.kdo));
  head.appendChild(z.izostal?el("span","pill duh","duh vaje"):el("span","pill",fmtMin(z.minute)));
  li.appendChild(head);
  li.appendChild(el("p","e-meta",dateLabel(z.datum)+" · "+(DOGODKI[z.dogodek]||z.dogodek)));
  var zv=zvezdice(z.minute||0,z.izostal),gz=el("div","e-gz");
  gz.appendChild(gzEl(zv));gz.appendChild(el("span","",ZVEZDE_IME[zv-1]));li.appendChild(gz);
  li.appendChild(el("p","e-why","»"+z.zakaj+"«"));
  verdicts(z.zakaj,z.datum).forEach(function(v){li.appendChild(verdictEl(v));});
  if(z.kazen){var p=el("p","e-pen");p.appendChild(el("b","","Predlog kazni: "));p.appendChild(document.createTextNode(z.kazen));li.appendChild(p);}
  var foot=el("div","e-foot"),del=el("button","ghost","Izbriši");del.type="button";
  del.addEventListener("click",function(){
    if(!del.dataset.sure){
      del.dataset.sure="1";del.textContent="Res izbrišem?";
      setTimeout(function(){delete del.dataset.sure;del.textContent="Izbriši";},4000);return;
    }
    del.disabled=true;
    api("/zbor/izbrisi","POST",{id:z.id}).then(function(){toast("Izbrisano. Sramota je odpuščena.");return osvezi();})
      .catch(function(e){del.disabled=false;toast(e.message,true);});
  });
  foot.appendChild(del);li.appendChild(foot);
  return li;
}
function renderLog(){
  var f=$("filter").value,ul=$("seznam");ul.textContent="";
  var list=zapisi.filter(function(z){return!f||z.kdo.toLowerCase()===f;});
  if(!list.length){ul.appendChild(el("li","empty",zapisi.length?"Tega zamudnika ni v kroniki.":"Kronika je prazna. Zbor je točen ali pa nihče ne piše."));$("vec").hidden=true;return;}
  list.slice(0,shown).forEach(function(z){ul.appendChild(entryEl(z));});
  $("vec").hidden=list.length<=shown;
}
$("filter").addEventListener("change",function(){shown=PAGE;renderLog();});
$("vec").addEventListener("click",function(){shown+=PAGE;renderLog();});

function narisi(){
  imenaChips();renderZid();renderLog();
  // verdikti v dnevniku potrebujejo vreme; naloži ga šele, če kak izgovor omenja vreme
  if(!hist&&zapisi.some(function(z){return matched(z.zakaj).length;}))loadHist().then(renderLog);
}

/* ───────── namestitev kot aplikacija ───────── */
// Chrome/Android: gumb se pokaže ob dogodku beforeinstallprompt in sproži pravo namestitveno okno.
// iPhone/iPad: dogodka ni, zato gumb takoj pokaže navodilo. V že nameščeni aplikaciji gumba ni.
var namestiEv=null;
var IOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
function jeNamescena(){return (window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true;}
function pokaziNamesti(){$("namesti").hidden=jeNamescena()||(!namestiEv&&!IOS);}
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();namestiEv=e;pokaziNamesti();});
window.addEventListener("appinstalled",function(){namestiEv=null;pokaziNamesti();toast("Nameščeno. Zamudometer je na začetnem zaslonu.");});
$("namesti").addEventListener("click",function(){
  if(namestiEv){
    namestiEv.prompt();
    namestiEv.userChoice.then(function(){namestiEv=null;pokaziNamesti();}).catch(function(){});
  }else{
    toast("V Safariju tapni gumb Deli in izberi »Dodaj na začetni zaslon«.",false,8000);
  }
});
pokaziNamesti();

$("tagline").textContent=pick(TAGLINES);
(function(){
  var d=new Date();$("datum").value=ymd(d);$("datum").max=ymd(d);
  var s=store();
  if(s)vstopi(s,true,true);
})();
})();
</script>
