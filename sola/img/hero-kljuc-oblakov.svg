<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t">
<title id="t">Ilustracija: različne vrste oblakov na nebu nad dolino</title>

<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
