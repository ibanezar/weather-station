<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t">
<title id="t">Ilustracija: beležka za vremenski dnevnik pod rahlim dežjem</title>

<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#bfe3ff"/>
    <stop offset="55%" stop-color="#e3f3ff"/>
    <stop offset="100%" stop-color="#eef8ea"/>
  </linearGradient>
  <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#8fc98a"/>
    <stop offset="100%" stop-color="#6fae6a"/>
  </linearGradient>
  <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#5f9f63"/>
    <stop offset="100%" stop-color="#3f7a48"/>
  </linearGradient>
  <radialGradient id="bokeh" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity=".9"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
</defs>



<rect width="1200" height="675" fill="url(#sky)"/>
<path d="M0 420 Q220 340 430 400 T860 380 Q1040 350 1200 410 V675 H0 Z" fill="url(#hill1)" opacity=".55"/>
<path d="M0 470 Q260 400 520 450 T1000 430 Q1120 415 1200 450 V675 H0 Z" fill="url(#hill2)" opacity=".85"/>
<circle cx="120" cy="140" r="34" fill="url(#bokeh)"/>
<circle cx="980" cy="90" r="46" fill="url(#bokeh)"/>
<circle cx="1080" cy="220" r="24" fill="url(#bokeh)"/>
<circle cx="220" cy="230" r="18" fill="url(#bokeh)"/>


<g transform="translate(600,300)">
  <rect x="-70" y="-30" width="140" height="180" rx="10" fill="#ffffff" stroke="#3f8fbf" stroke-width="4"/>
  <line x1="-70" y1="10" x2="70" y2="10" stroke="#c9dcef" stroke-width="3"/>
  <line x1="-50" y1="40" x2="50" y2="40" stroke="#c9dcef" stroke-width="3"/>
  <line x1="-50" y1="70" x2="50" y2="70" stroke="#c9dcef" stroke-width="3"/>
  <line x1="-50" y1="100" x2="20" y2="100" stroke="#c9dcef" stroke-width="3"/>
  <rect x="-70" y="-30" width="140" height="26" rx="8" fill="#0284c7"/>
  <g transform="translate(60,-55) rotate(35)">
