  <ellipse cx="740" cy="90" rx="4" ry="10"/>
  <ellipse cx="820" cy="170" rx="4" ry="10"/>
  <ellipse cx="500" cy="60" rx="3" ry="8"/>
</g>


<g stroke="#2f6b3c" stroke-width="6" stroke-linecap="round" opacity=".8">
  <path d="M60 675 C55 590 90 560 80 500"/>
  <path d="M110 675 C120 600 90 555 100 490"/>
