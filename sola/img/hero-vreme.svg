<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="solaHeroTitle">
<title id="solaHeroTitle">Ilustracija: dežne kaplje na travi in domači dežemer iz plastenke v vrtu</title>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#bfe3ff"/>
    <stop offset="55%" stop-color="#e3f3ff"/>
    <stop offset="100%" stop-color="#eef8ea"/>
  </linearGradient>
  <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#8fc98a"/>
    <stop offset="100%" stop-color="#6fae6a"/>
  </linearGradient>
  <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#5f9f63"/>
    <stop offset="100%" stop-color="#3f7a48"/>
  </linearGradient>
  <radialGradient id="bokeh" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity=".9"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="bottle" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#cdeaff" stop-opacity=".55"/>
    <stop offset="100%" stop-color="#8fd0ef" stop-opacity=".55"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<!-- oddaljeni griči Zgornje Savinjske doline -->
<path d="M0 420 Q220 340 430 400 T860 380 Q1040 350 1200 410 V675 H0 Z" fill="url(#hill1)" opacity=".55"/>
<path d="M0 470 Q260 400 520 450 T1000 430 Q1120 415 1200 450 V675 H0 Z" fill="url(#hill2)" opacity=".85"/>
<!-- bokeh svetlobne pike (učinek makro fotografije) -->
<circle cx="120" cy="140" r="34" fill="url(#bokeh)"/>
<circle cx="980" cy="90" r="46" fill="url(#bokeh)"/>
<circle cx="1080" cy="220" r="24" fill="url(#bokeh)"/>
<circle cx="220" cy="230" r="18" fill="url(#bokeh)"/>
<!-- trava v ospredju -->
<g stroke="#2f6b3c" stroke-width="6" stroke-linecap="round" opacity=".8">
  <path d="M60 675 C55 590 90 560 80 500"/>
  <path d="M110 675 C120 600 90 555 100 490"/>
  <path d="M1130 675 C1120 580 1160 550 1145 480"/>
  <path d="M1080 675 C1095 595 1060 560 1075 500"/>
</g>
<!-- domači dežemer iz plastenke -->
<g transform="translate(560,330)">
  <path d="M-46 300 L-46 40 Q-46 10 -20 -10 L-8 -40 L8 -40 L20 -10 Q46 10 46 40 L46 300 Z" fill="url(#bottle)" stroke="#3f8fbf" stroke-width="3"/>
  <line x1="-46" y1="150" x2="46" y2="150" stroke="#2b6f96" stroke-width="3"/>
  <line x1="-46" y1="220" x2="46" y2="220" stroke="#2b6f96" stroke-width="3" opacity=".6"/>
  <rect x="-46" y="180" width="92" height="120" fill="#bfe6ff" opacity=".5"/>
  <text x="0" y="60" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="20" fill="#155a7a" font-weight="700">mm</text>
</g>
<!-- kapljice dežja -->
<g fill="#4fa8e8" opacity=".75">
  <ellipse cx="430" cy="120" rx="4" ry="10"/>
  <ellipse cx="700" cy="90" rx="4" ry="10"/>
  <ellipse cx="800" cy="160" rx="4" ry="10"/>
  <ellipse cx="500" cy="60" rx="3" ry="8"/>
</g>
</svg>
