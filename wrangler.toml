name = "weatherireica1"
main = "worker.js"
compatibility_date = "2024-09-23"

[[r2_buckets]]
binding = "PHOTOS_R2"
bucket_name = "meteorec-photos"

[[kv_namespaces]]
binding = "COUNTER_KV"
id = "ad19629f12a042dd8cd90c64a68662b4"

[vars]
# Pošiljatelj e-obvestil o komentarjih (domena meteorec.si verificirana v Resend).
NOTIFY_FROM = "Meteorec <komentarji@meteorec.si>"

# ── Gobarska napoved Premium (Paddle Billing) ──
# Pošiljatelj magic-link e-pošte za premium dostop.
PREMIUM_FROM = "Meteorec gobarska napoved <gobe@meteorec.si>"
# Paddle API (za branje e-naslova kupca iz customer_id).
# Sandbox testiranje: "https://sandbox-api.paddle.com"
PADDLE_API_BASE = "https://api.paddle.com"
# Price ID-ja iz Paddle kataloga — nastavi po kreiranju produktov (pri_...).
PADDLE_PRICE_MONTHLY = "pri_REPLACE_MONTHLY"
PADDLE_PRICE_SEASON = "pri_REPLACE_SEASON"
# Konec gobarske sezone (MM-DD) — do takrat velja sezonska naročnina.
PREMIUM_SEASON_END = "11-30"
# Alarm "pogoji optimalni": prag indeksa in najmanjši razmik med obvestili (dni).
PREMIUM_ALERT_THRESHOLD = "70"
PREMIUM_ALERT_COOLDOWN_DAYS = "5"
# Sezonski zagon (25. 8. 2026): Paddle plačevanje zgoraj še ni priklopljeno,
# gobarska sezona pa se že začenja — dokler je "true", GET /premium/forecast
# vrne napoved brez žetona (glej worker.js in PREMIUM_FREE_LAUNCH v
# tools/generate_gobe_page.py, ki mora biti usklajen). AI prepoznava, alarmi
# in dnevnik ostanejo za pravim žetonom. Odstrani to vrstico (ali nastavi na
# "false"), ko je Paddle pripravljen za pravi zagon plačevanja.
PREMIUM_FREE_LAUNCH = "true"
# Skrivnosti (wrangler secret put …): PREMIUM_SYNC_KEY, PADDLE_WEBHOOK_SECRET,
# PADDLE_API_KEY (RESEND_API_KEY že obstaja).
# ANTHROPIC_KEY (wrangler secret put ANTHROPIC_KEY) — potreben za POST /premium/identify
# (AI prepoznava gobe iz fotografije, Claude vision). Brez njega endpoint vrne 503.

# Samodejni pragovni push alarm — preveri meritve vsakih 5 minut.
# Drugi urnik (zamaknjen 2 min) je za ICON napoved + sledenje nevihtnim
# celicam — ločeno od zgornjega, da ne tekmujeta za isti CPU/časovni
# proračun ene invokacije z že obstoječimi (težjimi) opravili zgoraj; glej
# scheduled() v worker.js, ki loči po event.cron.
#
# Tretji urnik je varovalka za GitHub Actions "schedule" prožilce, ki so se
# 31. 8. 2026 izkazali za nezanesljive do te mere, da nekateri delovni tokovi
# (storm-map.yml, vodostaj-forecast.yml) tisti dan sploh niso stekli sami od
# sebe (ne le zamudili — GitHubov cron dogodka ni nikoli dostavil), kljub že
# obstoječim dvojnim terminom in razširjenim oknom v teh delovnih tokovih.
# Cloudflarov Cron Trigger teče na ločeni infrastrukturi in take zanesljivostne
# težave doslej ni imel, zato ob 6:10/6:40/7:10/7:40 UTC (znotraj okna
# tools/storm_map_gate.py, 6:00-8:00) prek GitHub API pokliče workflow_dispatch
# za oba delovna tokova — glej _cronDispatchScheduledWorkflows() v worker.js.
# Rabi skrivnost GH_DISPATCH_TOKEN (fine-grained PAT, samo ta repo, "Actions:
# Read and write") — `wrangler secret put GH_DISPATCH_TOKEN`. Brez nje funkcija
# tiho ne naredi nič (glej manjkajoč env.GH_DISPATCH_TOKEN).
[triggers]
crons = ["*/5 * * * *", "2-59/5 * * * *", "10,40 6-7 * * *"]
