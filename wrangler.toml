name = "weatherireica1"
main = "worker.js"
compatibility_date = "2024-09-23"

[[r2_buckets]]
binding = "PHOTOS_R2"
bucket_name = "meteorec-photos"

[[kv_namespaces]]
binding = "COUNTER_KV"
id = "ad19629f12a042dd8cd90c64a68662b4"

# POST /premium/identify (AI prepoznava gobe iz fotografije) teče na Workers AI
# (@cf/moondream/moondream3.1-9B-A2B) — 10.000 brezplačnih Neuronov/dan, brez
# ločenega ključa/plačila (glej worker.js in IDENTIFY_DAILY_CAP spodaj).
[ai]
binding = "AI"

# Stalno beleženje strel (Blitzortung) blizu postaje — glej LightningLogger
# v worker.js. Durable Object drži eno samo, trajno odhodno WebSocket povezavo
# (namesto klientske v app.js, ki teče le, dokler ima kdo stran odprto) in
# strele shrani v svoj SQLite.
#
# Cena: dokler je odhodna WebSocket povezava odprta, se DO ne more hibernirati
# in se ves čas zaračunava po trajanju (GB-s) — okvirno ~10.800 GB-s/dan pri
# privzetih 128 MB. Brezplačni plan ima 13.000 GB-s/dan, kar je zelo tesno
# (~83 % samo za obstoj tega enega DO); plačljiv plan (5 $/mesec, 400.000
# GB-s/mesec vključenih) ima dovolj rezerve. Ob prekoračitvi na brezplačnem
# planu klici v ta DO preprosto odpovedo (ni doplačila) — beleženje se za tisti
# dan ustavi, ostala stran ostane nedotaknjena (ločen meter od običajnih
# Worker zahtev).
[[durable_objects.bindings]]
name = "LIGHTNING_LOGGER"
class_name = "LightningLogger"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LightningLogger"]

[vars]
# Pošiljatelj e-obvestil o komentarjih (domena meteorec.si verificirana v Resend).
NOTIFY_FROM = "Meteorec <komentarji@meteorec.si>"

# ── Gobarska napoved Premium (Paddle Billing) ──
# Pošiljatelj magic-link e-pošte za premium dostop.
PREMIUM_FROM = "Meteorec gobarska napoved <gobe@meteorec.si>"
# Paddle API (za branje e-naslova kupca iz customer_id).
# Sandbox testiranje: "https://sandbox-api.paddle.com"
PADDLE_API_BASE = "https://api.paddle.com"
# Price ID-ja iz Paddle kataloga — nastavi po kreiranju produktov (pri_...).
PADDLE_PRICE_MONTHLY = "pri_REPLACE_MONTHLY"
PADDLE_PRICE_SEASON = "pri_REPLACE_SEASON"
# Konec gobarske sezone (MM-DD) — do takrat velja sezonska naročnina.
PREMIUM_SEASON_END = "11-30"
# Alarm "pogoji optimalni": prag indeksa in najmanjši razmik med obvestili (dni).
PREMIUM_ALERT_THRESHOLD = "70"
PREMIUM_ALERT_COOLDOWN_DAYS = "5"
# Sezonski zagon (25. 8. 2026, razširjen na ves Premium 1. 9. 2026): Paddle
# plačevanje zgoraj še ni priklopljeno, zato dokler je "true": GET
# /premium/forecast vrne napoved brez žetona, POST /premium/login pa vsakemu
# e-naslovu brez naročnine podeli brezplačno (glej worker.js in
# PREMIUM_FREE_LAUNCH v tools/generate_gobe_page.py, ki mora biti usklajen) —
# to odklene tudi identify/alerts/dnevnik, ker gredo vsi skozi isti žeton.
# Odstrani to vrstico (ali nastavi na "false"), ko je Paddle pripravljen za
# pravi zagon plačevanja.
PREMIUM_FREE_LAUNCH = "true"
# Dnevna varovalka za POST /premium/identify (glej [ai] zgoraj) — pod okvirno
# brezplačno kvoto Workers AI (10.000 Neuronov/dan), da tudi ob nenadnem
# zanimanju dan ne preseže brezplačnega. Nastavljivo brez posega v kodo.
IDENTIFY_DAILY_CAP = "50"
# Skrivnosti (wrangler secret put …): PREMIUM_SYNC_KEY, PADDLE_WEBHOOK_SECRET,
# PADDLE_API_KEY (RESEND_API_KEY že obstaja). ANTHROPIC_KEY ni več potreben za
# /premium/identify (glej [ai] zgoraj) — uporablja ga le /ai-brief.

# Samodejni pragovni push alarm — preveri meritve vsakih 5 minut.
# Drugi urnik (zamaknjen 2 min) je za ICON napoved + sledenje nevihtnim
# celicam — ločeno od zgornjega, da ne tekmujeta za isti CPU/časovni
# proračun ene invokacije z že obstoječimi (težjimi) opravili zgoraj; glej
# scheduled() v worker.js, ki loči po event.cron.
#
# Tretji urnik je varovalka za GitHub Actions "schedule" prožilce, ki so se
# 31. 8. 2026 izkazali za nezanesljive do te mere, da nekateri delovni tokovi
# (storm-map.yml, vodostaj-forecast.yml) tisti dan sploh niso stekli sami od
# sebe (ne le zamudili — GitHubov cron dogodka ni nikoli dostavil), kljub že
# obstoječim dvojnim terminom in razširjenim oknom v teh delovnih tokovih.
# Cloudflarov Cron Trigger teče na ločeni infrastrukturi in take zanesljivostne
# težave doslej ni imel, zato ob 6:10/6:40/7:10/7:40 UTC (znotraj okna
# tools/storm_map_gate.py, 6:00-8:00) prek GitHub API pokliče workflow_dispatch
# za oba delovna tokova — glej _cronDispatchScheduledWorkflows() v worker.js.
# Rabi skrivnost GH_DISPATCH_TOKEN (fine-grained PAT, samo ta repo, "Actions:
# Read and write") — `wrangler secret put GH_DISPATCH_TOKEN`. Brez nje funkcija
# tiho ne naredi nič (glej manjkajoč env.GH_DISPATCH_TOKEN).
#
# Četrti urnik (02:05 UTC) je za lestvico igre /napovej/ — _cronScoreNapovej()
# v worker.js. Teče 30 min po forecast-verify.yml (01:35 UTC), ki tisto jutro
# razreši včerajšnji dan v forecast_verification.json; 30 min pustita čas za
# push in GitHub Pages redeploy, isti razlog kot pri drugih strežniško
# generiranih straneh (glej daily-story.yml v CLAUDE.md).
[triggers]
crons = ["*/5 * * * *", "2-59/5 * * * *", "10,40 6-7 * * *", "5 2 * * *"]
