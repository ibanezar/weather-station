<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Rezultati ankete</title>
<style>
:root{--bg:#fff;--fg:#1a1d21;--mut:#5b6470;--card:#f4f6f8;--bd:#d9dee4;--ac:#047857;--acfg:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1216;--fg:#e8ecef;--mut:#9aa5b1;--card:#171d23;--bd:#2a333c;--ac:#34d399;--acfg:#06281c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:.2em 0}
h2{font-size:1rem;margin:0 0 8px}
.meta{color:var(--mut);font-size:.9rem;margin-bottom:12px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0}
input{width:100%;padding:10px;font:inherit;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg)}
button{font:inherit;padding:10px 14px;border-radius:8px;border:1px solid var(--ac);background:var(--ac);color:var(--acfg);cursor:pointer;min-height:44px;font-weight:600;margin-top:8px}
.row{display:grid;grid-template-columns:110px 1fr 40px;gap:8px;align-items:center;margin:4px 0;font-size:.9rem}
.bar{height:12px;border-radius:6px;background:var(--ac);min-width:2px}
.n{text-align:right;color:var(--mut)}
.txt{border-top:1px solid var(--bd);padding:8px 0;font-size:.95rem}
.txt small{color:var(--mut);display:block}
#err{color:#b91c1c;margin-top:8px;min-height:1.3em}
</style>
</head>
<body>
<main>
<h1>Rezultati ankete</h1>
<div class="meta" id="meta">Samo za Filipa. Geslo (<code>DELETE_SECRET</code>) se hrani samo v tem zavihku.</div>
<div class="c" id="login">
<label for="pw">Geslo</label>
<input id="pw" type="password" autocomplete="off">
<button id="go" type="button">Prikaži rezultate</button>
<div id="err" role="status"></div>
</div>
<div id="out"></div>
</main>
<script>
(function(){
var PROXY="https://weatherireica1.filip-eremita.workers.dev";
// Možnosti so podvojitev SURVEY_OPTS iz app.js (oznake samo za prikaz).
var Q={q1:["Kaj jih je pripeljalo",{trenutno:"Trenutno vreme",napoved:"Napoved",gobe:"Gobe",nevihte:"Nevihte",crnivec:"Črnivec",drugo:"Drugo"}],
 q2:["Kaj jim je najbolj všeč",{trenutno:"Trenutno vreme",napoved:"Napoved",radar:"Radar",gobe:"Gobe",nevihte:"Nevihte",crnivec:"Črnivec",igre:"Igre",drugo:"Drugo"}],
 q3:["Kako so nas našli",{google:"Google",facebook:"Facebook",instagram:"Instagram",prijatelj:"Prijatelj",drugo:"Drugo"}],
 q5:["Aplikacija za telefon",{android:"Android",iphone:"iPhone",oba:"Oba",ne:"Ne rabim je"}]};
var $=function(i){return document.getElementById(i);};
function store(v){try{if(v===undefined)return sessionStorage.getItem("anketa-pw");sessionStorage.setItem("anketa-pw",v);}catch(_){}return null;}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e;}
function render(rows){
  var out=$("out");out.textContent="";
  var first=rows.length?rows[rows.length-1].ts.slice(0,10):"—";
  $("meta").textContent="Odgovorov: "+rows.length+" · od "+first;
  Object.keys(Q).forEach(function(q){
    var card=el("div","c");card.appendChild(el("h2","",Q[q][0]));
    var cnt={},tot=0;
    rows.forEach(function(r){if(r[q]){cnt[r[q]]=(cnt[r[q]]||0)+1;tot++;}});
    var keys=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a];});
    if(!keys.length)card.appendChild(el("div","meta","Še ni odgovorov."));
    keys.forEach(function(k){
      var row=el("div","row");row.appendChild(el("span","",Q[q][1][k]||k));
      var b=el("div","bar");b.style.width=Math.round(100*cnt[k]/cnt[keys[0]])+"%";
      row.appendChild(b);row.appendChild(el("span","n",String(cnt[k])));card.appendChild(row);
    });
    if(keys.length)card.appendChild(el("div","meta","Skupaj odgovorov na vprašanje: "+tot));
    out.appendChild(card);
  });
  var free=rows.filter(function(r){return r.q4;});
  var c=el("div","c");c.appendChild(el("h2","","Kaj jim manjka ("+free.length+")"));
  free.forEach(function(r){var t=el("div","txt",r.q4);t.appendChild(el("small","",r.ts.slice(0,10)));c.appendChild(t);});
  if(!free.length)c.appendChild(el("div","meta","Še ni odgovorov."));
  out.appendChild(c);
}
function load(){
  var pw=$("pw").value||store();if(!pw){$("err").textContent="Vpiši geslo.";return;}
  $("err").textContent="Nalagam …";
  fetch(PROXY+"/anketa/rezultati",{headers:{Authorization:"Bearer "+pw}}).then(function(r){
    if(r.status===401)throw new Error("Napačno geslo (ali preveč poskusov — počakaj 15 min).");
    if(!r.ok)throw new Error("Napaka "+r.status);return r.json();
  }).then(function(d){store(pw);$("login").hidden=true;render(d.odgovori||[]);})
  .catch(function(e){$("err").textContent=e.message;});
}
$("go").onclick=load;
$("pw").onkeydown=function(e){if(e.key==="Enter")load();};
if(store())load();
})();
</script>
</body>
</html>
