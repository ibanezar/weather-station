# species_rules.yaml — pravila gobarskega modela po vrstah
#
# AVTOMATSKO GENERIRANO iz data/baza_gob.xlsx prek
# tools/import_species_db.py. To datoteko lahko ročno urejaš in kalibriraš —
# regeneracija jo prepiše, zato spremembe pomeni prenesti tudi v bazo ali skript.
#
# Izpeljane vrednosti (talno-temp. okno, padavinski pragovi, višina, geološka
# afiniteta, nočna ohladitev, ekološka skupina in rastni zamik) so označene
# '# TODO: kalibriraj'. Neposredno iz baze (sezona, zračni prag, mikoriza,
# dvojnice, užitnost) niso.
# Zadnja regeneracija: 2026-08-13 · 300 vrst.

# Globalne uteži za izračun indeksa (0–100)
weights:
  temperature: 0.35      # ujemanje temperature z optimalnim oknom vrste
                         # (talna pri mikoriznih in razkrojevalkah, zračna pri lesnih)
  rain_trigger: 0.25     # sprožilni dež v zamiku vrste (fruiting_lag_days)
  rain_base: 0.15        # zaloga vode v tleh 14 dni pred zamikom
  soil_moisture: 0.10
  humidity: 0.08
  temp_drop: 0.07        # nočna ohladitev kot sprožilec

# Globalni kalibracijski parametri točkovanja (veljajo za vse vrste).
scoring:
  rain:
    oversat_ratio: 3.0       # TODO: kalibriraj — večkratnik praga, kjer se začne prenamočenost
    oversat_max_ratio: 6.0   # TODO: kalibriraj — večkratnik praga, kjer je upad največji
    oversat_factor: 0.5      # TODO: kalibriraj — minimalni prispevek ob ekstremni namočenosti
  soil_moisture:
    dry: 0.12                # TODO: kalibriraj — pod tem prispevek 0
    full: 0.28               # TODO: kalibriraj — nad tem polni prispevek
  humidity:
    rh_low: 60               # TODO: kalibriraj
    rh_full: 85              # TODO: kalibriraj
    dewpoint_spread_full: 2.0  # TODO: kalibriraj
  temp_drop:
    window_days: 5           # TODO: kalibriraj
    min_drop_c: 3.0          # TODO: kalibriraj
    persist_days: 4          # TODO: kalibriraj
  # Pri lesnih vrstah odloča zračna temperatura (rastejo na lesu nad tlemi),
  # zato njihov trapez nastane iz air_temp s temi rameni.
  temperature:
    air_shoulder_c: 3.0      # TODO: kalibriraj — širina ramen pri zračni temp.
  elevation:
    out_of_range_factor: 0.7  # TODO: kalibriraj
  # Izpeljava talno-temp. okna iz zračnega praga (soil hladnejši/dušen od zraka).
  soil_temp_from_air:
    offset_c: -1.5           # TODO: kalibriraj — zamik zrak→tla
    shoulder_c: 3.0          # TODO: kalibriraj — širina ramen trapeza
  # Ujemanje geološke afinitete vrste s terenom lokacije.
  geology:
    match_factor: 1.15       # TODO: kalibriraj — afiniteta se ujema s terenom
    mismatch_factor: 0.75    # TODO: kalibriraj — afiniteta se NE ujema
    neutral_factor: 1.0      # vrsta brez izrazite geološke preference

# Ekološke skupine. fruiting_lag_days je zamik med sprožilnim dežjem in
# trosnjakom; model za ta zamik premakne obe padavinski okni, tako da ista
# ploha pri razkrojevalki in pri mikorizni vrsti ne šteje isti dan.
# Vrednost tu je izhodišče, iz katerega import_species_db.py napolni
# fruiting_lag_days pri vrsti — model bere vrednost PRI VRSTI, zato jo lahko
# za posamezno vrsto ročno prepišeš, ne da bi premaknil celo skupino.
ecologies:
  - id: razkrojevalka
    name_sl: "Razkrojevalka stelje in travinja"
    fruiting_lag_days: { min: 2, max: 8 }  # TODO: kalibriraj
    note: "Kukmaki, tintnice, plešivke, marela. Trosnjak sledi dežju v nekaj dneh."
  - id: lesna
    name_sl: "Lesna razkrojevalka / parazit na lesu"
    fruiting_lag_days: { min: 3, max: 10 }  # TODO: kalibriraj
    note: "Ostrigar, panjevka, štorovka, uhljevka. Les zadržuje vlago, odziv je nekaj dni daljši."
  - id: mikorizna
    name_sl: "Mikorizna vrsta"
    fruiting_lag_days: { min: 8, max: 16 }  # TODO: kalibriraj
    note: "Gobani, lisičke, golobice. Trosnjak pride šele teden in pol do dva po sprožilnem dežju."

# Geološki tereni doline (za geo-afiniteto v izračunu po lokaciji).
terrains:
  - id: kisla
    name_sl: "Kislo/vulkansko pogorje (Smrekovec)"
    note: "Silikatna kisla tla; dobro zadržujejo vlago. Kraljestvo jurčka in žametastega gobana."
  - id: bazicna
    name_sl: "Karbonatni masivi (Golte, Menina, Raduha)"
    note: "Apnenčasta bazična tla; hitreje se sušijo. Kraljestvo marele in poletnega gobana."
  - id: vlazna
    name_sl: "Rečni logi in dolinske terase"
    note: "Stalno vlažna tla ob Savinji in Dreti. Kraljestvo smrčkov in uhljevk."

# Napovedne točke. protected=true → zaščiteno območje, ne prikazuj kot nabiralno mesto.
# picking_restriction (samo pri protected=true): "unknown" | "prohibited". UI sme
# pisati "nabiranje prepovedano" SAMO pri "prohibited" IN obstoječem restriction_source
# (preverjen pravni vir za TO območje) — sicer nevtralno "preveri omejitve". Trenutno za
# nobeno območje ni preverjenega vira za splošno prepoved gobarjenja, zato je edino
# zavarovano območje (Logarska dolina) na "unknown". Ne spreminjaj v "prohibited" brez
# konkretnega vira.
