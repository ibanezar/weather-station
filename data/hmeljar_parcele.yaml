# data/hmeljar_parcele.yaml — parcele za MeteoHmeljar (/meteohmeljar/)
#
# Eno gospodarstvo, znane parcele — ni baze, ni prijave. Ročno urejano, isti
# vzorec kot species_rules.yaml (CALIBRATION) / fetch_hydrants.py
# (HYDRANT_OVERRIDES). Bere ga tools/generate_hmeljar_page.py.
#
# "id" je slug (uporabi se v URL-ju /meteohmeljar/<id>/ in v imenu dnevnika
# data/meteohmeljar/<id>-log.json) — se ne spreminja, ko je parcela enkrat
# objavljena (kot pri kodah i/<koda> za kratke povezave).
#
# operation_profile: privzete vrednosti (glej hmelj_standard spodaj) so PRVI
# PRIBLIŽEK za v0.1 (docs/meteohmeljar-v0.1-spec.md §9) — popravi jih iz
# izkušenj, ne čakaj na "popolne" številke.
#
# Spodnji dve parceli sta DEMO, NI FILIPOVA LAST: koordinate/površina so iz
# javnega MKGP GIS sloja RABA (geohub.gov.si, RABA_ID=1160 = Hmeljišče),
# dve realni hmeljišči čisto blizu postaje IREICA1 — samo za testiranje
# enginea na pravih koordinatah/površinah namesto na eni sami točki. Sorta/
# namakanje nista znana (raba to ne pove, samo mejo in tip rabe) —
# "neznano"/"brez" dokler ju ne potrdi dejanski lastnik. RABA sama po sebi
# NE pove lastništva; za pravo parcelo katerega koli hmeljarja je treba to
# potrditi pri njem, ne domnevati iz sloja.

parcele:
  - id: demo-1
    naziv: "Demo hmeljišče 1 (MKGP RABA_PID 3730018, ni last uporabnika)"
    lat: 46.3217
    lon: 14.9142
    povrsina_ha: 2.63
    sorta: "neznano"
    namakanje: brez   # kapljicno | razprsevanje | brez
    aktivna: true
    operation_profile: hmelj_standard

  - id: demo-2
    naziv: "Demo hmeljišče 2 (MKGP RABA_PID 288247, ni last uporabnika)"
    lat: 46.3195
    lon: 14.9111
    povrsina_ha: 2.40
    sorta: "neznano"
    namakanje: brez
    aktivna: true
    operation_profile: hmelj_standard

operation_profiles:
  hmelj_standard:
    wind_optimal_kmh: 2
    wind_max_kmh: 8
    gust_max_kmh: 15
    temperature_min_c: 8
    temperature_max_c: 25
    temperature_shoulder_low_c: 12
    temperature_shoulder_high_c: 22
    rainfree_hours_required: 4
    rh_wet_leaf_pct: 95
    rh_taper_start_pct: 70
    wet_leaf_allowed: false
    precip_prob_gate_pct: 50
    precip_prob_taper_pct: 40
